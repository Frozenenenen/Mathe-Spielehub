<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathe-Spiele</title>
<script id="fehleranzeige">
// Zeigt Fehler sichtbar an, statt nur eine leere Seite zu hinterlassen.
// So laesst sich auf Tablets ohne Entwicklerwerkzeuge erkennen, was schiefgeht.
window.addEventListener('error', function (e) {
  var kasten = document.getElementById('startfehler');
  if (!kasten) {
    kasten = document.createElement('div');
    kasten.id = 'startfehler';
    kasten.style.cssText = 'margin:20px auto;max-width:900px;padding:14px 18px;border:2px solid #D64545;' +
      'border-radius:6px;background:#FBE3E3;color:#16263F;font:15px system-ui,sans-serif';
    (document.body || document.documentElement).appendChild(kasten);
  }
  kasten.textContent = 'Beim Starten ist ein Fehler aufgetreten: ' + e.message +
    (e.lineno ? ' (Zeile ' + e.lineno + ')' : '');
});
</script>
<style>
:root {
    --papier: #FCFDFF;
    --karo: #E3EBF7;
    --tinte: #16263F;
    --blau: #1D4ED8;
    --blau-hell: #DBEAFE;
    --gruen: #0E7C57;
    --gruen-hell: #D7F2E6;
    --rot: #D64545;
    --rot-hell: #FBE3E3;
    --gelb: #F5A524;
    --grau: #6B7A90;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 28px 18px 60px;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color: var(--tinte);
    background-color: var(--papier);
    background-image:
      linear-gradient(var(--karo) 1px, transparent 1px),
      linear-gradient(90deg, var(--karo) 1px, transparent 1px);
    background-size: 26px 26px;
    background-position: -1px -1px;
  }

  .blatt {
    max-width: 940px;
    margin: 0 auto;
  }

  h1 {
    font-size: 34px;
    margin: 0 0 4px;
    letter-spacing: -0.4px;
  }

  .unterzeile {
    margin: 0 0 26px;
    color: var(--grau);
    font-size: 15px;
  }

  /* ---------- Spielauswahl ---------- */
  .kacheln {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 16px;
  }

  .kachel {
    border: 2px solid var(--tinte);
    border-radius: 6px;
    background: #fff;
    padding: 16px 16px 14px;
    text-align: left;
    cursor: pointer;
    font: inherit;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .kachel:hover { background: var(--blau-hell); }
  .kachel:focus-visible { outline: 3px solid var(--blau); outline-offset: 2px; }

  .kachel h2 { font-size: 19px; margin: 0; }
  .kachel p { margin: 0; font-size: 14px; color: var(--grau); line-height: 1.4; }
  .kachel .bestzeit { font-size: 13px; color: var(--blau); font-weight: bold; }
  .klassenmarke {
    align-self: flex-start;
    font-size: 12px; font-weight: bold;
    color: var(--blau); background: var(--blau-hell);
    border-radius: 999px; padding: 3px 10px;
  }

  /* ---------- Spielansicht ---------- */
  .kopfzeile {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  .uhr {
    font-size: 26px;
    font-weight: bold;
    font-variant-numeric: tabular-nums;
    color: var(--blau);
  }

  .fortschritt { font-size: 15px; color: var(--grau); }

  .buehne {
    border: 2px solid var(--tinte);
    border-radius: 6px;
    background: #fff;
    padding: 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .aufgabentext { font-size: 17px; margin: 0; text-align: center; max-width: 60ch; }

  /* ---------- Bedienelemente ---------- */
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 5px;
    border: 2px solid var(--tinte);
    padding: 9px 16px;
    background: #fff;
    color: var(--tinte);
  }

  button:focus-visible { outline: 3px solid var(--blau); outline-offset: 2px; }

  .haupt {
    background: var(--blau);
    border-color: var(--blau);
    color: #fff;
    font-size: 17px;
    padding: 11px 26px;
  }

  .haupt:hover { background: #1740b0; }
  .schlicht:hover { background: var(--blau-hell); }

  input[type="text"], input[type="number"] {
    font: inherit;
    font-size: 21px;
    text-align: center;
    width: 84px;
    padding: 7px 4px;
    border: 2px solid var(--grau);
    border-radius: 5px;
    background: #fff;
    color: var(--tinte);
    font-variant-numeric: tabular-nums;
  }

  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

  input:focus { outline: none; border-color: var(--blau); }
  input.richtig { border-color: var(--gruen); background: var(--gruen-hell); }
  input.falsch { border-color: var(--rot); background: var(--rot-hell); }

  .rueckmeldung {
    font-size: 17px;
    min-height: 26px;
    text-align: center;
    font-weight: bold;
  }
  .rueckmeldung.gut { color: var(--gruen); }
  .rueckmeldung.schlecht { color: var(--rot); }

  /* ---------- Hundertertafel ---------- */
  .tafel { display: grid; grid-template-columns: repeat(3, 72px); gap: 6px; }
  .tfeld {
    height: 48px;
    border: 2px solid var(--blau);
    border-radius: 5px;
    background: var(--blau-hell);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; font-weight: bold;
    font-variant-numeric: tabular-nums;
  }
  .tfeld.leer { background: #fff; padding: 2px; }
  .tfeld.aus { border: none; background: transparent; }
  .tfeld input { width: 100%; height: 100%; border: none; background: #fff; border-radius: 3px;
                 font-weight: bold; font-size: 19px; }
  .tfeld input.richtig { background: var(--gruen-hell); box-shadow: inset 0 0 0 2px var(--gruen); }
  .tfeld input.falsch  { background: var(--rot-hell);   box-shadow: inset 0 0 0 2px var(--rot); }

  /* ---------- Zerlegungshaus ---------- */
  .haus { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .hdach {
    width: 0; height: 0;
    border-left: 96px solid transparent;
    border-right: 96px solid transparent;
    border-bottom: 46px solid var(--blau);
  }
  .hganzes {
    width: 186px; height: 50px;
    border: 2px solid var(--blau); border-radius: 4px; background: var(--blau-hell);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: bold; font-variant-numeric: tabular-nums;
    margin-top: -2px;
  }
  .hganzes input { width: 100%; height: 100%; border: none; background: #fff;
                   border-radius: 3px; font-size: 24px; font-weight: bold; }
  .hzeile { display: flex; gap: 6px; }
  .hzelle {
    width: 90px; height: 46px;
    border: 2px solid var(--blau); border-radius: 4px; background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 21px; font-weight: bold; font-variant-numeric: tabular-nums;
  }
  .hzelle.fest { background: var(--blau-hell); }
  .hzelle.eingabe { padding: 3px; }
  .hzelle input { width: 100%; height: 100%; border: none; background: #fff;
                  border-radius: 3px; font-size: 21px; font-weight: bold; }
  .hzelle input.richtig, .hganzes input.richtig {
    background: var(--gruen-hell); box-shadow: inset 0 0 0 2px var(--gruen); }
  .hzelle input.falsch, .hganzes input.falsch {
    background: var(--rot-hell); box-shadow: inset 0 0 0 2px var(--rot); }

  /* ---------- Malkreuz ---------- */
  .kreuz { display: grid; grid-template-columns: repeat(3, 92px); gap: 6px; }
  .kfeld {
    height: 50px;
    border: 2px solid var(--blau);
    border-radius: 5px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: bold;
    font-variant-numeric: tabular-nums;
  }
  .kfeld.rand { background: var(--blau-hell); }
  .kfeld.eingabe { padding: 3px; }
  .kfeld input { width: 100%; height: 100%; border: none; background: #fff; border-radius: 3px;
                 font-weight: bold; font-size: 20px; }
  .kfeld.rand input { background: var(--blau-hell); }
  .kfeld input.richtig { background: var(--gruen-hell); box-shadow: inset 0 0 0 2px var(--gruen); }
  .kfeld input.falsch  { background: var(--rot-hell);   box-shadow: inset 0 0 0 2px var(--rot); }
  .ksumme { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: bold; }

  /* ---------- Klickgitter für Symmetrie und Vergrößern ---------- */
  .kaestchen { fill: #fff; stroke: #CBD5E1; stroke-width: 1; cursor: pointer; }
  .kaestchen:hover { fill: #EAF1FC; }
  .kaestchen.gesetzt { fill: var(--gelb); }
  .kaestchen.richtig { fill: var(--gruen-hell); stroke: var(--gruen); stroke-width: 2; }
  .kaestchen.falsch  { fill: var(--rot-hell);   stroke: var(--rot);   stroke-width: 2; }
  .kaestchen.fest { fill: #93C5FD; stroke: var(--blau); stroke-width: 1.5; cursor: default; }
  .achse { stroke: var(--gelb); stroke-width: 3; stroke-dasharray: 7 5; }

  /* ---------- Formen und Netze ---------- */
  .karten { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .karte {
    border: 2px solid var(--blau); border-radius: 8px; background: #fff;
    padding: 8px; cursor: pointer; line-height: 0;
  }
  .karte[aria-pressed="true"] { background: #FFF3DC; border-color: var(--gelb); border-width: 3px; }
  .karte.richtig { border-color: var(--gruen); background: var(--gruen-hell); }
  .karte.falsch  { border-color: var(--rot);   background: var(--rot-hell); }

  /* ---------- Koordinaten ---------- */
  .gitterpunkt { fill: transparent; cursor: pointer; }
  .gitterpunkt:hover { fill: #BFD4F5; }
  .gitterpunkt.gesetzt { fill: var(--gelb); }
  .gitterpunkt.richtig { fill: var(--gruen); }
  .gitterpunkt.falsch  { fill: var(--rot); }
  .punktliste { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
                font-size: 20px; font-weight: bold; }
  .punktliste span { background: var(--blau-hell); border-radius: 6px; padding: 4px 12px; }

  /* ---------- Stellenwerttafel ---------- */
  .swtafel { border-collapse: collapse; }
  .tafelrahmen { max-width: 100%; overflow-x: auto; padding-bottom: 4px; }
  .swtafel th { background: var(--blau); color: #fff; font-size: 15px;
                padding: 6px 10px; border: 2px solid var(--blau); }
  .swtafel td { border: 2px solid var(--blau); padding: 4px; text-align: center;
                font-size: 21px; font-weight: bold; font-variant-numeric: tabular-nums;
                min-width: 58px; background: #fff; }
  .swtafel td input { width: 50px; font-size: 21px; padding: 4px 0; }
  .swzahl { font-size: 27px; font-weight: bold; font-variant-numeric: tabular-nums; }

  /* ---------- Preistabelle ---------- */
  .preistabelle { border-collapse: collapse; }
  .preistabelle th, .preistabelle td {
    border: 2px solid var(--blau); padding: 7px 12px; text-align: center;
    font-size: 18px; font-variant-numeric: tabular-nums; }
  .preistabelle th { background: var(--blau); color: #fff; font-size: 15px; }
  .preistabelle td { background: #fff; font-weight: bold; }
  .preistabelle td input { width: 92px; font-size: 18px; padding: 5px 0; }

  /* ---------- Kombinatorik ---------- */
  .gruppen { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .gruppenzeile { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .gruppenzeile .titel { font-weight: bold; min-width: 108px; }
  .marke2 { background: var(--blau-hell); border-radius: 999px; padding: 3px 11px; font-size: 15px; }

  /* ---------- Umfang und Fläche ---------- */
  .masse { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .masszeile { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: bold; }
  .masszeile .wort { font-size: 16px; font-weight: normal; color: var(--grau); min-width: 108px; }
  .masszeile input { width: 96px; font-size: 20px; }

  /* ---------- Geld ---------- */
  .kasse { display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
           font-size: 18px; }
  .kassenzeile { display: flex; gap: 12px; align-items: baseline; }
  .kassenzeile .preis { font-weight: bold; font-variant-numeric: tabular-nums; min-width: 92px;
                        text-align: right; }
  .geldeingabe { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
                 font-size: 21px; font-weight: bold; }
  .geldeingabe input { width: 88px; font-size: 20px; }
  .geldeingabe .wort { font-size: 16px; font-weight: normal; color: var(--grau); }

  /* ---------- Zahlenfolgen ---------- */
  .folge { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .fglied {
    min-width: 76px; height: 52px; padding: 0 6px;
    border: 2px solid var(--blau); border-radius: 5px; background: var(--blau-hell);
    display: flex; align-items: center; justify-content: center;
    font-size: 21px; font-weight: bold; font-variant-numeric: tabular-nums;
  }
  .fglied.luecke { background: #fff; padding: 3px; }
  .fglied input { width: 72px; height: 100%; border: none; background: #fff;
                  border-radius: 3px; font-size: 21px; font-weight: bold; }
  .fglied input.richtig { background: var(--gruen-hell); box-shadow: inset 0 0 0 2px var(--gruen); }
  .fglied input.falsch  { background: var(--rot-hell);   box-shadow: inset 0 0 0 2px var(--rot); }

  /* ---------- Halbschriftliches Rechnen ---------- */
  .hschritt {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 22px; font-weight: bold; font-variant-numeric: tabular-nums;
  }
  .hschritt input { font-size: 21px; width: 96px; }
  .hschritt .marke {
    font-size: 14px; font-weight: normal; color: var(--grau);
    min-width: 74px; text-align: right;
  }
  .hschritt .vorher { color: var(--grau); font-weight: normal; font-size: 18px; }

  /* ---------- Division mit Rest ---------- */
  .divzeile {
    display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
    font-size: 28px; font-weight: bold; font-variant-numeric: tabular-nums;
  }
  .divzeile input { font-size: 25px; width: 90px; }
  .divzeile .wort { font-size: 20px; font-weight: normal; }

  /* ---------- Fehlersuche ---------- */
  .fspalte {
    width: 46px; height: 44px; padding: 0;
    border: 2px solid var(--karo); border-radius: 5px; background: #fff;
    font-size: 25px; font-weight: bold; color: var(--tinte);
    font-variant-numeric: tabular-nums;
  }
  .fspalte[aria-pressed="true"] { border-color: var(--blau); background: var(--blau-hell); }
  .fspalte.richtig { border-color: var(--gruen); background: var(--gruen-hell); }
  .fspalte.falsch  { border-color: var(--rot);   background: var(--rot-hell); }

  /* ---------- Schriftliche Addition ---------- */
  .rechnung { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
  .rzeile { display: flex; align-items: center; gap: 4px; }
  .rzelle {
    width: 46px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    font-size: 25px; font-weight: bold;
    font-variant-numeric: tabular-nums;
  }
  .rzeichen { width: 30px; text-align: center; font-size: 25px; font-weight: bold; }
  .rzelle input { width: 42px; height: 40px; font-size: 23px; padding: 0; border: 2px solid var(--grau); }
  .rstrich { height: 3px; background: var(--tinte); border-radius: 2px; }
  .rzelle.unterstrich { border-bottom: 3px solid var(--tinte); }
  .rzelle.klein { font-size: 20px; color: var(--grau); }
  .ruebertrag { height: 34px; }
  .ukreis {
    width: 34px; height: 32px; padding: 0;
    border: 2px dashed var(--gelb); border-radius: 17px;
    background: #FFFCF4; color: #b26a00;
    font-size: 17px; font-weight: bold; line-height: 1;
  }
  .ukreis:hover { background: #FFF3DC; }
  .ukreis[aria-pressed="true"] { background: #FFF3DC; border-style: solid; }
  .uhinweis { font-size: 13px; color: var(--grau); margin: 2px 0 0; text-align: right; }
  .ukreis.richtig { border-color: var(--gruen); background: var(--gruen-hell); border-style: solid; }
  .ukreis.falsch  { border-color: var(--rot);   background: var(--rot-hell);   border-style: solid; }
  .rzelle input.richtig { border-color: var(--gruen); background: var(--gruen-hell); }
  .rzelle input.falsch  { border-color: var(--rot);   background: var(--rot-hell); }

  /* ---------- Runden ---------- */
  .zahlzeile { display: flex; gap: 3px; font-size: 40px; font-weight: bold;
               font-variant-numeric: tabular-nums; justify-content: center; align-items: center; }
  .zahlzeile span { padding: 2px 5px; }
  .rziffer {
    font: inherit; font-size: 40px; font-weight: bold;
    padding: 2px 9px; border: 2px dashed var(--karo); border-radius: 6px;
    background: #fff; color: var(--tinte); cursor: pointer; line-height: 1.1;
  }
  .rziffer:hover { border-color: var(--blau); }
  .rziffer.ziel { background: var(--blau); color: #fff; border-color: var(--blau); border-style: solid; }
  .rziffer.entscheid { background: var(--gelb); color: #6b4300; border-color: var(--gelb); border-style: solid; }
  .rziffer.falsch { border-color: var(--rot); border-style: solid; }
  .rziffer.richtig { border-color: var(--gruen); border-style: solid; }
  .legende { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center;
             font-size: 14px; color: var(--grau); }
  .legende b { padding: 2px 8px; border-radius: 5px; font-weight: bold; }
  .legende .ziel { background: var(--blau); color: #fff; }
  .legende .entscheid { background: var(--gelb); color: #6b4300; }

  /* ---------- Platzhalter ---------- */
  .gleichung {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; flex-wrap: wrap;
    font-size: 30px; font-weight: bold;
    font-variant-numeric: tabular-nums;
  }
  .gleichung input { font-size: 27px; width: 100px; }

  /* ---------- Größen ---------- */
  .umrechnung {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; flex-wrap: wrap;
    font-size: 24px; font-weight: bold;
    font-variant-numeric: tabular-nums;
  }
  .umrechnung .einheit { font-size: 19px; font-weight: normal; }

  /* ---------- Bruch ---------- */
  .brucheingabe { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .brucheingabe input.richtig { border-color: var(--gruen); background: var(--gruen-hell); }
  .brucheingabe input.falsch  { border-color: var(--rot);   background: var(--rot-hell); }
  .bruchstrich { width: 92px; height: 3px; background: var(--tinte); border-radius: 2px; }

  /* ---------- Tabellen ---------- */
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--karo); }
  th { background: var(--blau); color: #fff; }
  tr.ich td { background: var(--gelb); font-weight: bold; }
  td.zeit, th.zeit { text-align: right; font-variant-numeric: tabular-nums; }

  .liste { border: 2px solid var(--tinte); border-radius: 6px; background: #fff; overflow: hidden; margin-top: 26px; }
  .liste h2 { font-size: 18px; margin: 0; padding: 14px 16px 10px; }
  .liste p { margin: 0; padding: 0 16px 16px; color: var(--grau); font-size: 14px; }

  .knopfreihe { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  @media (prefers-reduced-motion: no-preference) {
    .wackeln { animation: wackeln 0.32s; }
    @keyframes wackeln {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      75% { transform: translateX(7px); }
    }
  }

  /* ---------- Diagnose ---------- */
  .dzugang {
    display: flex; flex-direction: column; gap: 4px; width: 100%;
    margin: 28px 0 0; padding: 14px 18px; text-align: left; cursor: pointer;
    font: inherit; color: var(--tinte);
    background: var(--blau-hell); border: 2px solid var(--blau); border-radius: 6px;
  }
  .dzugang strong { font-size: 19px; color: var(--blau); }
  .dzugang span { font-size: 14px; }
  .dzugang:hover { background: #cfe0fc; }
  .dkasten { margin-top: 0; margin-bottom: 22px; }
  .dkasten h2 + p, .dkasten h2 + ol { margin-top: 0; }
  .dstartkasten { text-align: left; }
  .dstartkasten .knopfreihe { justify-content: flex-start; }
  .dstufen { display: flex; flex-wrap: wrap; gap: 10px; }
  .dstufe { display: flex; flex-direction: column; gap: 2px; min-width: 210px; padding: 10px 14px;
            text-align: left; font: inherit; color: var(--tinte); cursor: pointer;
            background: #fff; border: 2px solid var(--karo); border-radius: 6px; }
  .dstufe span { font-size: 13px; color: var(--grau); }
  .dstufe[aria-pressed="true"] { border-color: var(--blau); background: var(--blau-hell); }
  .dwahlen { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px; }
  .dwahl { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px;
           border: 1.5px solid var(--karo); border-radius: 6px; background: #fff; cursor: pointer; }
  .dwahl input { width: 18px; height: 18px; margin-top: 2px; flex: none; }
  .dwahl small { color: var(--grau); }

function mauerAufbauen(grundreihe) {
  const reihen = [grundreihe.slice()];
  while (reihen[reihen.length - 1].length > 1) {
    const unten = reihen[reihen.length - 1];
    const oben = [];
    for (let i = 0; i < unten.length - 1; i++) oben.push(unten[i] + unten[i + 1]);
    reihen.push(oben);
  }
  return reihen; // reihen[0] = unten

    for (let r = 0; r < reihen.length - 1; r++) {
      for (let i = 0; i < reihen[r + 1].length; i++) {
        const links = bekannt[r][i];

        const dach = bekannt[r + 1][i];
        const anzahl = (links ? 1 : 0) + (rechts ? 1 : 0) + (dach ? 1 : 0);
        if (anzahl !== 2) continue;
        if (!dach) { bekannt[r + 1][i] = true; geaendert = true; }

// Manche Spiele haben so viele Eingabefelder, dass fuenf Aufgaben zu lang waeren.
// Klassenstufe je Schwierigkeitsstufe, als kurze Angabe fuer die Oberflaeche.
function klasseFuerStufe(spielId, stufe) {
  const liste = SPIELE[spielId].klassen;
  return liste ? liste[stufe - 1] : null;
}

function klassenSpanne(spielId) {
  const liste = SPIELE[spielId].klassen;
  if (!liste || !liste.length) return '';
  const von = Math.min.apply(null, liste), bis = Math.max.apply(null, liste);
  return von === bis ? 'Klasse ' + von : 'Klasse ' + von + ' bis ' + bis;
}

function aufgabenProRunde() {
  const spiel = SPIELE[stand.spiel];
  if (spiel && typeof spiel.aufgaben === 'function') return spiel.aufgaben(stand.stufe, aktuelleOption());
  return (spiel && spiel.aufgaben) || AUFGABEN_PRO_RUNDE;
}

let stand = {
  ansicht: 'hub',
  spiel: null,
  stufe: 1,
  nummer: 0,
  start: 0,
  fehler: 0,
  uebersprungen: 0,
  aufgabe: null,
  geloest: false,
  tickt: null,
  sperrTakt: null,
  bestenliste: [],
  letzterName: '',
  speicherLaeuft: false,
  speicherArt: 'keiner'
};

/* ---------- Speicher ---------- */

const SCHLUESSEL = 'mathe-hub:bestenliste';

// Die Datei laeuft in zwei Umgebungen: als Artefakt im Claude-Fenster, dort gibt es
// window.storage, und als normale Datei im Browser, dort tut es localStorage.
// Beides wird der Reihe nach versucht, damit die Liste in beiden Faellen bleibt.
async function speicherLesen(schluessel = SCHLUESSEL) {
  try {
    const ergebnis = await window.storage.get(schluessel);
    if (ergebnis && ergebnis.value) {
      stand.speicherArt = 'claude';
      return ergebnis.value;
    }
  } catch (fehler) { /* kein Claude-Speicher vorhanden */ }
  try {
    const text = window.localStorage.getItem(schluessel);
    stand.speicherArt = 'browser';
    return text;
  } catch (fehler) {
    stand.speicherArt = 'keiner';
    return null;
  }
}

async function speicherSchreiben(text, schluessel = SCHLUESSEL) {
  let geschrieben = false;
  try {
    await window.storage.set(schluessel, text);
    stand.speicherArt = 'claude';
    geschrieben = true;
  } catch (fehler) { /* weiter zum Browser-Speicher */ }
  try {
    window.localStorage.setItem(schluessel, text);
    if (!geschrieben) stand.speicherArt = 'browser';
    geschrieben = true;
  } catch (fehler) { /* privater Modus oder Speicher voll */ }
  if (!geschrieben) stand.speicherArt = 'keiner';
  return geschrieben;
}

async function bestenlisteLaden() {
  try {
    const text = await speicherLesen();
    const daten = text ? JSON.parse(text) : null;
    stand.bestenliste = (daten && daten.eintraege) || [];
    stand.letzterName = (daten && daten.letzterName) || '';
  } catch (fehler) {
    stand.bestenliste = [];
  }
}

async function bestenlisteSpeichern() {
  await speicherSchreiben(JSON.stringify({
    eintraege: stand.bestenliste,
    letzterName: stand.letzterName
  }));
}

function speicherHinweis() {
  if (stand.speicherArt === 'browser') return 'Die Liste bleibt in diesem Browser gespeichert.';
  if (stand.speicherArt === 'claude') return 'Die Liste bleibt in deinem Claude-Konto gespeichert.';
  return 'Achtung: Dieser Browser erlaubt kein Speichern. Die Liste gilt nur für diese Sitzung.';
}

// ---------- Sichern und Laden als Datei ----------

function listeSichern() {
  const text = JSON.stringify({ eintraege: stand.bestenliste, letzterName: stand.letzterName }, null, 2);
  const blob = new Blob([text], { type: 'application/json' });
  const verweis = document.createElement('a');
  verweis.href = URL.createObjectURL(blob);
  const heute = new Date().toISOString().slice(0, 10);
  verweis.download = 'mathe-bestenliste-' + heute + '.json';
  verweis.click();
  URL.revokeObjectURL(verweis.href);
}

function kennung(eintrag) {
  return [eintrag.name, eintrag.spiel, eintrag.stufe, eintrag.option, eintrag.ms, eintrag.datum].join('|');
}

function eintragBereinigen(e) {
  if (!e || typeof e !== 'object' || !SPIELE[e.spiel]) return null;
  const zahl = (w, ersatz) => (Number.isFinite(Number(w)) ? Number(w) : ersatz);
  const stufe = Math.round(zahl(e.stufe, 0));
  if (stufe < 1 || stufe > SPIELE[e.spiel].stufen.length) return null;
  return {
    name: String(e.name || 'Ohne Namen').slice(0, 24), spiel: e.spiel, stufe,
    ms: Math.max(0, zahl(e.ms, 0)), fehler: Math.max(0, Math.round(zahl(e.fehler, 0))),
    uebersprungen: Math.max(0, Math.round(zahl(e.uebersprungen, 0))), datum: zahl(e.datum, 0),
    ...(SPIELE[e.spiel].option && SPIELE[e.spiel].option.werte.some(w => w.wert === e.option)
      ? { option: e.option } : {})
  };
}

async function listeLaden(datei) {
  try {
    const text = await datei.text();
    const daten = JSON.parse(text);
    // Eingelesene Eintraege werden neu aufgebaut. So landet aus einer fremden Datei
    // nur, was wirklich ein Eintrag ist: Text bleibt Text, Zahlen bleiben Zahlen.
    const neue = ((daten && daten.eintraege) || []).map(eintragBereinigen).filter(Boolean);
    const bekannt = new Set(stand.bestenliste.map(kennung));
    let dazu = 0;
    neue.forEach(e => {
      if (!bekannt.has(kennung(e))) { stand.bestenliste.push(e); dazu++; }
    });
    await bestenlisteSpeichern();
    zeichnen();
    hinweisZeigen(dazu === 0 ? 'Keine neuen Einträge gefunden.'
      : dazu === 1 ? 'Ein Eintrag wurde ergänzt.' : dazu + ' Einträge wurden ergänzt.');
  } catch (fehler) {
    hinweisZeigen('Die Datei konnte nicht gelesen werden.');
  }
}

// Rueckfragen ohne Dialogfenster. confirm() und alert() werden in manchen
// Umgebungen (etwa eingebettet im Claude-Fenster) stillschweigend blockiert.
// Deshalb muss ein Knopf fuer heikle Aktionen zweimal angetippt werden.
function zweimalTippen(knopf, frage) {
  if (knopf.dataset.bereit === '1') {
    clearTimeout(Number(knopf.dataset.takt));
    return true;
  }
  knopf.dataset.bereit = '1';
  knopf.dataset.text = knopf.textContent;
  knopf.textContent = frage;
  knopf.classList.add('nachfrage');
  knopf.dataset.takt = String(setTimeout(() => {
    knopf.dataset.bereit = '';
    knopf.textContent = knopf.dataset.text;
    knopf.classList.remove('nachfrage');
  }, 4000));
  return false;
}

function hinweisZeigen(text) {
  const alt = document.getElementById('hinweisfenster');
  if (alt) alt.remove();
  const kasten = document.createElement('div');
  kasten.id = 'hinweisfenster';
  kasten.className = 'hinweisfenster';
  kasten.textContent = text;
  document.body.appendChild(kasten);
  setTimeout(() => kasten.remove(), 4000);
}

function bestzeit(spielId) {
  const passend = stand.bestenliste.filter(e => e.spiel === spielId);
  if (!passend.length) return null;
  return Math.min.apply(null, passend.map(e => e.ms));
}

// Manche Spiele haben vor dem Start eine Wahl, etwa die Einmaleins-Reihe.
// Sie gehoert zur Stufe dazu: Zeiten mit verschiedener Wahl werden nicht verglichen.
function aktuelleOption(spielId = stand.spiel) {
  const spiel = SPIELE[spielId];
  if (!spiel || !spiel.option) return undefined;
  const gemerkt = (stand.optionen || {})[spielId];
  if (spiel.option.werte.some(w => w.wert === gemerkt)) return gemerkt;
  return spiel.option.standard !== undefined ? spiel.option.standard : spiel.option.werte[0].wert;
}

function optionText(spielId, wert) {
  const spiel = SPIELE[spielId];
  if (!spiel || !spiel.option || wert === undefined) return '';
  const w = spiel.option.werte.find(x => x.wert === wert);
  return w ? w.text : '';
}

// Stufenname samt Wahl, zum Beispiel "durcheinander, 8er"
function stufenText(spielId, stufe, option) {
  const name = SPIELE[spielId].stufen[stufe - 1];
  const zusatz = optionText(spielId, option);
  return zusatz ? name + ', ' + zusatz : name;
}

function rangliste(spielId, stufe, option) {
  return stand.bestenliste
    .filter(e => e.spiel === spielId && e.stufe === stufe && e.option === option)
    .sort((a, b) => a.ms - b.ms);
}

/* ---------- Ansichten ---------- */

const blatt = document.getElementById('blatt');

function zeichnen() {
  if (stand.ansicht === 'hub') zeichneHub();
  else if (stand.ansicht.startsWith('d')) zeichneDiagnose();
  else if (stand.ansicht === 'auswahl') zeichneAuswahl();
  else if (stand.ansicht === 'spiel') zeichneSpiel();
  else zeichneErgebnis();
}

function zeichneHub() {
  // Nach Klassenstufe sortiert, damit die leichten Spiele oben stehen.
  const sortiert = Object.keys(SPIELE).sort((a, b) => {
    const ka = SPIELE[a].klassen || [9], kb = SPIELE[b].klassen || [9];
    return Math.min.apply(null, ka) - Math.min.apply(null, kb) ||
           Math.max.apply(null, ka) - Math.max.apply(null, kb) ||
           SPIELE[a].name.localeCompare(SPIELE[b].name);
  });

  const kacheln = sortiert.map(id => {
    const spiel = SPIELE[id];
    const beste = bestzeit(id);
    return `<button class="kachel" data-spiel="${id}">
      ${spiel.bild}
      <span class="klassenmarke">${klassenSpanne(id)}</span>
      <h2>${spiel.name}</h2>
      <p>${spiel.beschreibung}</p>
      <span class="bestzeit">${beste ? 'Beste Runde: ' + zeitText(beste) : 'Noch keine Zeit'}</span>
    </button>`;
  }).join('');

  const alle = stand.bestenliste.slice().sort((a, b) => a.ms - b.ms).slice(0, 8);
  const listeInhalt = alle.length
    ? `<table><thead><tr><th>Name</th><th>Spiel</th><th>Stufe</th><th class="zeit">Zeit</th>
        <th class="zeit">Fehler</th></tr></thead><tbody>
        ${alle.map(e => `<tr><td>${entschaerfen(e.name)}</td><td>${SPIELE[e.spiel].name}</td>
          <td>${stufenText(e.spiel, e.stufe, e.option)}</td><td class="zeit">${zeitText(e.ms)}</td>
          <td class="zeit">${fehlerText(e)}</td></tr>`).join('')}
      </tbody></table>`
    : `<p>Hier stehen die schnellsten Runden, sobald jemand ein Spiel beendet hat.</p>`;

  blatt.innerHTML = `
    <h1>Mathe-Spiele</h1>
    <p class="unterzeile">Fünf Aufgaben pro Runde. Die Zeit läuft ab der ersten Aufgabe.</p>
    <div class="kacheln">${kacheln}</div>
    <div class="liste"><h2>Schnellste Runden</h2>${listeInhalt}</div>
    <p class="unterzeile" style="margin-top:12px">${speicherHinweis()}</p>
    <div class="knopfreihe" style="justify-content:flex-start">
      <button class="schlicht" id="sichern">Liste als Datei sichern</button>
      <button class="schlicht" id="laden">Liste aus Datei ergänzen</button>
      <button class="schlicht" id="leeren">Liste löschen</button>
      <input type="file" id="dateiwahl" accept="application/json,.json" style="display:none">
    </div>
    <button class="dzugang" id="diagnose">
      <strong>Diagnose</strong>
      <span>Kurzer Querschnitt durch alle Grundschulthemen. Zeigt, wo die Lücken liegen.</span>
    </button>`;

  blatt.querySelectorAll('.kachel').forEach(knopf => {
    knopf.addEventListener('click', () => spielWaehlen(knopf.dataset.spiel));
  });

  document.getElementById('diagnose').addEventListener('click', () => {
    stand.ansicht = 'dstart';
    zeichnen();
  });
  document.getElementById('sichern').addEventListener('click', listeSichern);

  const dateiwahl = document.getElementById('dateiwahl');
  document.getElementById('laden').addEventListener('click', () => dateiwahl.click());
  dateiwahl.addEventListener('change', () => {
    if (dateiwahl.files && dateiwahl.files[0]) listeLaden(dateiwahl.files[0]);
    dateiwahl.value = '';
  });

  document.getElementById('leeren').addEventListener('click', async ereignis => {
    if (!stand.bestenliste.length) return;
    if (!zweimalTippen(ereignis.currentTarget, 'Wirklich alles löschen?')) return;
    stand.bestenliste = [];
    await bestenlisteSpeichern();
    zeichnen();
  });
}

function spielWaehlen(id) {
  stand.spiel = id;
  stand.ansicht = 'auswahl';
  zeichnen();
}

function zeichneAuswahl() {
  const spiel = SPIELE[stand.spiel];
  const knoepfe = spiel.stufen.map((text, i) => {
    const beste = rangliste(stand.spiel, i + 1, aktuelleOption())[0];
    const klasse = klasseFuerStufe(stand.spiel, i + 1);
    return `<button class="kachel" data-stufe="${i + 1}">
      ${klasse ? `<span class="klassenmarke">Klasse ${klasse}</span>` : ''}
      <h2>${text}</h2>
      <span class="bestzeit">${beste
        ? 'Beste Runde: ' + zeitText(beste.ms) + ' (' + entschaerfen(beste.name) + ')'
        : 'Noch keine Zeit'}</span>
    </button>`;
  }).join('');

  blatt.innerHTML = `
    <div class="kopfzeile">
      <button class="schlicht" id="zurueck">Zur Übersicht</button>
    </div>
    <h1>${spiel.name}</h1>
    <p class="unterzeile">${spiel.beschreibung}
      ${typeof spiel.aufgaben === 'function' ? 'Wähle eine Stufe, dann startet die Runde.'
        : 'Wähle eine Stufe, dann startet die Runde mit ' + aufgabenProRunde() + ' Aufgaben.'}</p>
    ${spiel.option ? `<p class="aufgabentext" style="text-align:left;margin:0 0 8px">${spiel.option.titel}</p>
      <div class="optionsbereich">${[...new Set(spiel.option.werte.map(w => (w.gruppe === undefined ? 1 : w.gruppe)))].sort((x, y) => x - y).map(g => `<div class="optionswahl">${
        spiel.option.werte.filter(w => (w.gruppe === undefined ? 1 : w.gruppe) === g).map(w => `<button class="optionsknopf"
        data-option="${w.wert}" aria-pressed="${w.wert === aktuelleOption()}">${w.text}</button>`).join('')}</div>`).join('')}</div>` : ''}
    <div class="kacheln">${knoepfe}</div>`;

  blatt.querySelectorAll('.optionsknopf').forEach(k => k.addEventListener('click', () => {
    stand.optionen = stand.optionen || {};
    stand.optionen[stand.spiel] = Number(k.dataset.option);
    zeichnen();
  }));

  document.getElementById('zurueck').addEventListener('click', () => {
    stand.ansicht = 'hub';
    zeichnen();
  });
  blatt.querySelectorAll('.kachel').forEach(knopf => {
    knopf.addEventListener('click', () => rundeStarten(Number(knopf.dataset.stufe)));
  });
}

function rundeStarten(stufe) {
  stand.stufe = stufe;
  stand.ansicht = 'spiel';
  stand.nummer = 0;
  stand.start = 0;
  stand.fehler = 0;
  stand.uebersprungen = 0;
  stand.notizen = new Set();
  neueAufgabe();
}

function neueAufgabe() {
  stand.geloest = false;
  stand.letzteProbe = null;
  const modul = SPIELMODULE[stand.spiel];
  if (modul) {
    const opt = aktuelleOption();
    stand.aufgabe = modul.aufgabe(stand.stufe, opt === undefined ? undefined : { [modul.option.name]: opt });
  }
  else console.error('Kein Spielmodul für ' + stand.spiel);
  zeichnen();
  erstesFeldFokussieren(blatt);
}

// Setzt den Cursor ins erste Feld. In Zeilen, die von rechts gerechnet werden,
// ist das das rechte Ende der Zeile, also die Einerstelle.
function erstesFeldFokussieren(wurzel) {
  const erstes = wurzel.querySelector('input:not([disabled])');
  if (!erstes) return;
  if (erstes.dataset.ziffer === 'links') {
    const reihe = zifferReihe(erstes);
    reihe[reihe.length - 1].focus();
  } else {
    erstes.focus();
  }
}

function uhrStarten() {
  if (stand.tickt) return;
  stand.tickt = setInterval(() => {
    const anzeige = document.getElementById('uhr');
    if (anzeige && stand.start) anzeige.textContent = zeitText(Date.now() - stand.start);
  }, 250);
}

function uhrStoppen() {
  clearInterval(stand.tickt);
  stand.tickt = null;
  clearInterval(stand.sperrTakt);
}

function zeichneSpiel() {
  const spiel = SPIELE[stand.spiel];

  blatt.innerHTML = `
    <div class="kopfzeile">
      <button class="schlicht" id="zurueck">Runde abbrechen</button>
      <span class="fortschritt">Aufgabe ${stand.nummer + 1} von ${aufgabenProRunde()}
        &nbsp;&middot;&nbsp; <span id="fehleranzeige">${stand.fehler}</span> Fehler
        <span id="sprunganzeige">${stand.uebersprungen
          ? '&nbsp;&middot;&nbsp; ' + stand.uebersprungen + ' übersprungen' : ''}</span></span>
      <span class="uhr" id="uhr">${stand.start ? zeitText(Date.now() - stand.start) : '0:00'}</span>
    </div>
    <h1>${spiel.name}</h1>
    <p class="unterzeile">Stufe: ${stufenText(stand.spiel, stand.stufe, aktuelleOption())}${
      klasseFuerStufe(stand.spiel, stand.stufe)
        ? ' &nbsp;·&nbsp; Klasse ' + klasseFuerStufe(stand.spiel, stand.stufe) : ''}</p>
    <div class="buehne">
      ${spielfeld()}
      <div class="rueckmeldung" id="rueckmeldung"></div>
      <div class="knopfreihe">
        <button class="haupt" id="pruefen">Prüfen</button>
        <button class="schlicht" id="ueberspringen">Lösung zeigen</button>
        <button class="schlicht" id="weiter" style="display:none">Nächste Aufgabe</button>
      </div>
    </div>`;

  document.getElementById('zurueck').addEventListener('click', () => {
    uhrStoppen();
    stand.ansicht = 'auswahl';
    stand.start = 0;
    stand.nummer = 0;
    zeichnen();
  });

  document.getElementById('pruefen').addEventListener('click', pruefen);
  const weiterschalten = () => {
    stand.nummer++;
    if (stand.nummer >= aufgabenProRunde()) {
      uhrStoppen();
      stand.ansicht = 'ergebnis';
      zeichnen();
    } else {
      neueAufgabe();
    }
  };

  document.getElementById('weiter').addEventListener('click', weiterschalten);

  // Wer nicht weiterkommt, soll nicht festhaengen. Die Aufgabe wird gezaehlt,
  // damit die Runde vergleichbar bleibt.
  document.getElementById('ueberspringen').addEventListener('click', () => {
    if (stand.geloest) { weiterschalten(); return; }
    stand.uebersprungen++;
    stand.geloest = true;
    clearInterval(stand.sperrTakt);
    loesungZeigen();
    melden('So wäre es richtig gewesen. Schau es dir in Ruhe an.', false);

    document.getElementById('pruefen').style.display = 'none';
    document.getElementById('ueberspringen').style.display = 'none';
    const weiter = document.getElementById('weiter');
    weiter.style.display = 'inline-block';
    weiter.textContent = 'Weiter';

    // Zwangspause, damit die Loesung nicht weggeklickt wird, bevor man sie gelesen hat
    let rest = 8;
    weiter.disabled = true;
    weiter.textContent = 'Weiter (' + rest + ')';
    const takt = setInterval(() => {
      rest--;
      if (rest > 0) {
        weiter.textContent = 'Weiter (' + rest + ')';
      } else {
        clearInterval(takt);
        weiter.disabled = false;
        weiter.textContent = 'Weiter';
        weiter.focus();
      }
    }, 1000);
  });

  feldBinden(() => {
    if (stand.geloest) document.getElementById('weiter').click();
    else pruefen();
  });

  // Die Loesung gibt es erst nach einer Minute. Vorher ist der Knopf gesperrt und
  // zaehlt sichtbar herunter, damit klar ist, dass er spaeter nutzbar wird.
  clearInterval(stand.sperrTakt);
  const springen = document.getElementById('ueberspringen');
  if (springen) {
    let rest = 60;
    springen.disabled = true;
    springen.textContent = 'Lösung zeigen (' + rest + ')';
    stand.sperrTakt = setInterval(() => {
      const knopf = document.getElementById('ueberspringen');
      if (!knopf) { clearInterval(stand.sperrTakt); return; }
      rest--;
      if (rest > 0) {
        knopf.textContent = 'Lösung zeigen (' + rest + ')';
      } else {
        clearInterval(stand.sperrTakt);
        knopf.disabled = false;
        knopf.textContent = 'Lösung zeigen';
      }
    }, 1000);
  }

  if (!stand.start) stand.start = Date.now();
  uhrStarten();
}

// Bindet alle Bedienelemente des Spielfelds: Modul-eigene Bindungen und die
// gemeinsamen Klickelemente. Wird vom Spiel und vom Diagnosemodus benutzt.
function feldBinden(beiEnter) {
  // Kaestchen, Gitterpunkte, Rundungsziffern und Fehlerspalten bindet das
  // jeweilige Modul selbst. Hier doppelt gebunden, schaltete jeder Tipp zweimal um.
  const modulBinden = SPIELMODULE[stand.spiel];
  if (modulBinden && modulBinden.binden) modulBinden.binden(stand.aufgabe, modulKontext());

  blatt.querySelectorAll('.karte').forEach(karte => {
    karte.addEventListener('click', () => {
      karte.classList.remove('richtig', 'falsch');
      karte.setAttribute('aria-pressed',
        karte.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
    });
  });

  zifferSprungBinden();

  blatt.querySelectorAll('input').forEach(feld => {
    feld.addEventListener('keydown', ereignis => {
      // Eine gehaltene Taste wiederholt sich, sonst prueft das Spiel im Dauerlauf
      if (ereignis.repeat) return;
      if (ereignis.key === 'Enter') {
        ereignis.preventDefault();
        beiEnter();
      }
    });
    feld.addEventListener('input', () => {
      feld.classList.remove('falsch', 'richtig');
    });
  });
}

// Felder fuer genau eine Ziffer (data-ziffer) springen nach jeder Eingabe weiter.
// data-ziffer gibt die uebliche Richtung an: "links" fuer Ergebniszeilen, die von
// rechts nach links gerechnet werden, "rechts" fuer alles, was man von vorn liest.
// Ist das Nachbarfeld in dieser Richtung schon belegt oder fehlt es, geht es in die
// andere Richtung. Wer also vorn anfaengt, wird automatisch nach rechts gefuehrt.
// Ruecktaste in einem leeren Feld springt zurueck.
function zifferReihe(feld) {
  const reihe = feld.closest('.rzeile, tr, .masse') || blatt;
  return [...reihe.querySelectorAll('input[data-ziffer]')].filter(f => !f.disabled);
}

function zifferSprungBinden() {
  blatt.querySelectorAll('input[data-ziffer]').forEach(feld => {
    feld.addEventListener('input', () => {
      const ziffern = feld.value.replace(/\D/g, '');
      if (!ziffern) return;
      // Eine zweite Ziffer ersetzt die erste, statt das Feld zu ueberfuellen
      if (feld.value !== ziffern.slice(-1)) feld.value = ziffern.slice(-1);
      const reihe = zifferReihe(feld);
      const i = reihe.indexOf(feld);
      const vor = feld.dataset.ziffer === 'links' ? -1 : 1;
      const frei = (j) => reihe[j] && reihe[j].value === '' ? reihe[j] : null;
      const ziel = frei(i + vor) || frei(i - vor);
      if (ziel) {
        ziel.dataset.vorher = feld.dataset.feld;
        ziel.focus();
      }
    });
    feld.addEventListener('keydown', ereignis => {
      if (ereignis.key !== 'Backspace' || feld.value !== '' || !feld.dataset.vorher) return;
      const zurueck = blatt.querySelector(`input[data-feld="${feld.dataset.vorher}"]`);
      if (zurueck && !zurueck.disabled) {
        ereignis.preventDefault();
        zurueck.focus();
        zurueck.select();
      }
    });
    feld.addEventListener('focus', () => { try { feld.select(); } catch (f) { /* nicht jedes Feld kann markieren */ } });
  });
}

// Zeichnet ein Ziffernblatt. Wird von der Uhr und von den Zeitspannen benutzt.
function uhrBild(stunde, minute, groesse) {
  const mx = 100, my = 100, r = 86;
  const striche = [];
  for (let i = 1; i <= 12; i++) {
    const w = (i * 30 - 90) * Math.PI / 180;
    striche.push(`<line x1="${mx + (r - 9) * Math.cos(w)}" y1="${my + (r - 9) * Math.sin(w)}"
      x2="${mx + r * Math.cos(w)}" y2="${my + r * Math.sin(w)}" stroke="#16263F" stroke-width="2.5"/>`);
    striche.push(`<text x="${mx + (r - 24) * Math.cos(w)}" y="${my + (r - 24) * Math.sin(w) + 6}"
      text-anchor="middle" font-size="17" font-weight="bold" fill="#16263F">${i}</text>`);
  }
  const wStunde = ((stunde % 12) * 30 + minute * 0.5 - 90) * Math.PI / 180;
  const wMinute = (minute * 6 - 90) * Math.PI / 180;
  return `<svg viewBox="0 0 200 200" width="${groesse}" height="${groesse}" role="img"
      aria-label="Uhr, ${stunde} Uhr ${minute} Minuten">
      <circle cx="${mx}" cy="${my}" r="${r}" fill="#fff" stroke="#1D4ED8" stroke-width="2.5"/>
      ${striche.join('')}
      <line x1="${mx}" y1="${my}" x2="${mx + 0.52 * r * Math.cos(wStunde)}" y2="${my + 0.52 * r * Math.sin(wStunde)}"
        stroke="#16263F" stroke-width="5" stroke-linecap="round"/>
      <line x1="${mx}" y1="${my}" x2="${mx + 0.8 * r * Math.cos(wMinute)}" y2="${my + 0.8 * r * Math.sin(wMinute)}"
        stroke="#EA580C" stroke-width="3.4" stroke-linecap="round"/>
      <circle cx="${mx}" cy="${my}" r="4" fill="#16263F"/>
    </svg>`;
}




/* ---------- Pruefen ---------- */

function felderLesen() {
  const werte = {};
  blatt.querySelectorAll('input[data-feld]').forEach(feld => {
    werte[feld.dataset.feld] = feld.value.trim();
  });
  return werte;
}

// Prueft eine Ziffernzeile als Ganzes. Es zaehlt die Ziffernfolge, nicht die Spalte:
// Bei drei Feldern und einer zweistelligen Zahl sind sowohl die beiden vorderen als
// auch die beiden hinteren Felder in Ordnung, solange keine Luecke dazwischen liegt.
// Fuehrende Nullen sind erlaubt: 0804 ist dieselbe Zahl wie 804.
// Markiert wird jede Ziffer einzeln, damit man sieht, welche Stelle nicht stimmt.
function gruppePruefen(namen, sollText, werte) {
  const ohneNullen = t => t.replace(/^0+(?=\d)/, '');
  const eingaben = namen.map(n => (werte[n] === undefined ? '' : String(werte[n]).trim()));
  const belegt = [];
  eingaben.forEach((v, i) => { if (v !== '') belegt.push(i); });

  if (belegt.length === 0) return { leer: true, richtig: sollText === '' };

  const zusammenhaengend = belegt[belegt.length - 1] - belegt[0] + 1 === belegt.length;
  const text = belegt.map(i => eingaben[i]).join('');
  const soll = ohneNullen(String(sollText));
  const richtig = zusammenhaengend && ohneNullen(text) === soll;

  if (richtig || !zusammenhaengend) {
    // Mit Luecke laesst sich keine Ziffer sicher einer Stelle zuordnen
    belegt.forEach(i => markieren(namen[i], richtig));
  } else {
    // Von rechts vergleichen. Vor der Zahl ist nur eine Null richtig.
    belegt.slice().reverse().forEach((i, k) => {
      const sollZiffer = soll[soll.length - 1 - k];
      markieren(namen[i], sollZiffer === undefined ? eingaben[i] === '0' : eingaben[i] === sollZiffer);
    });
  }
  return { leer: false, richtig };
}

// Fasst den aktuellen Stand aller Eingaben und Markierungen zusammen. Damit
// laesst sich erkennen, ob seit dem letzten Pruefen ueberhaupt etwas geaendert wurde.

// Traegt die Loesung ein und markiert sie, auch bei den Klickspielen.
function loesungZeigen() {
  const modul = SPIELMODULE[stand.spiel];
  if (modul) modul.loesung(stand.aufgabe, modulKontext());
}

function antwortSignatur() {
  const teile = [];
  blatt.querySelectorAll('input[data-feld]').forEach(f =>
    teile.push(f.dataset.feld + '=' + f.value.trim()));
  blatt.querySelectorAll('.ukreis').forEach(k =>
    teile.push('u' + k.dataset.uebertrag + '=' + (k.dataset.wert || 0)));
  blatt.querySelectorAll('.fspalte[aria-pressed="true"]').forEach(k =>
    teile.push('s' + k.dataset.spalte));
  blatt.querySelectorAll('.kaestchen.gesetzt').forEach(k =>
    teile.push('k' + k.dataset.x + ',' + k.dataset.y));
  blatt.querySelectorAll('.gitterpunkt.gesetzt').forEach(k =>
    teile.push('p' + k.dataset.x + ',' + k.dataset.y));
  blatt.querySelectorAll('.karte[aria-pressed="true"]').forEach(k =>
    teile.push('c' + k.dataset.karte));
  blatt.querySelectorAll('.rziffer.ziel').forEach(k => teile.push('z' + k.dataset.stelle));
  blatt.querySelectorAll('.rziffer.entscheid').forEach(k => teile.push('e' + k.dataset.stelle));
  return teile.join('|');
}

function markieren(schluessel, richtig) {
  const feld = blatt.querySelector(`input[data-feld="${schluessel}"]`);
  if (!feld) return;
  feld.classList.remove(richtig ? 'falsch' : 'richtig');
  feld.classList.add(richtig ? 'richtig' : 'falsch');
}

function pruefen() {
  if (stand.geloest) return;
  const werte = felderLesen();
  // Felder mit data-frei duerfen leer bleiben, etwa die vorderste Ergebnisstelle.
  const freieFelder = new Set();
  blatt.querySelectorAll('input[data-frei]').forEach(f => freieFelder.add(f.dataset.feld));
  const leer = Object.keys(werte).filter(k => werte[k] === '' && !freieFelder.has(k));
  if (leer.length) {
    melden('Es fehlt noch eine Eingabe.', false);
    return;
  }

  const modul = SPIELMODULE[stand.spiel];
  if (!modul) { console.error('Kein Spielmodul für ' + stand.spiel); return; }
  const ergebnis = modul.pruefe(stand.aufgabe, modulKontext()) || {};
  if (ergebnis.offen) { melden(ergebnis.offen, false); return; }
  const falsche = ergebnis.falsche || [];
  const hinweis = ergebnis.hinweis || '';

  if (falsche.length === 0) {
    stand.geloest = true;
    melden(stand.nummer + 1 === aufgabenProRunde() ? 'Richtig. Runde geschafft.' : 'Richtig.', true);
    document.getElementById('pruefen').style.display = 'none';
    clearInterval(stand.sperrTakt);
    const springen = document.getElementById('ueberspringen');
    if (springen) springen.style.display = 'none';
    const weiter = document.getElementById('weiter');
    weiter.style.display = 'inline-block';
    weiter.textContent = stand.nummer + 1 === aufgabenProRunde() ? 'Runde abschließen' : 'Nächste Aufgabe';
    weiter.focus();
  } else {
    const signatur = antwortSignatur();
    const unveraendert = signatur === stand.letzteProbe;
    stand.letzteProbe = signatur;

    // Dieselbe Antwort noch einmal zu pruefen ist kein neuer Fehlversuch
    if (!unveraendert) {
      stand.fehler++;
      const anzeige = document.getElementById('fehleranzeige');
      if (anzeige) anzeige.textContent = stand.fehler;
    }
    melden(hinweis || fehlermeldung(falsche), false);
    if (!unveraendert) {
      const buehne = blatt.querySelector('.buehne');
      buehne.classList.remove('wackeln');
      void buehne.offsetWidth;
      buehne.classList.add('wackeln');
    }
  }
}

function divisionMeldung(ergebnis, schema) {
  const stuecke = [];
  if (ergebnis) stuecke.push(ergebnis === 1 ? 'eine Ergebnisziffer' : ergebnis + ' Ergebnisziffern');
  if (schema) stuecke.push(schema === 1 ? 'eine Zahl im Schema' : schema + ' Zahlen im Schema');
  if (!stuecke.length) return '';
  return 'Noch nicht richtig: ' + stuecke.join(' und ') + '.';
}

function multiplikationMeldung(teile, ergebnis) {
  const stuecke = [];
  if (teile) stuecke.push(teile === 1 ? 'eine Ziffer in den Teilprodukten'
    : teile + ' Ziffern in den Teilprodukten');
  if (ergebnis) stuecke.push(ergebnis === 1 ? 'eine Ziffer im Ergebnis'
    : ergebnis + ' Ziffern im Ergebnis');
  if (!stuecke.length) return '';
  return 'Noch nicht richtig: ' + stuecke.join(' und ') + '.';
}

function malkreuzMeldung(zerlegung, produkte, summe) {
  const teile = [];
  if (zerlegung) teile.push(zerlegung === 1 ? 'eine Zahl der Zerlegung' : zerlegung + ' Zahlen der Zerlegung');
  if (produkte) teile.push(produkte === 1 ? 'ein Feld' : produkte + ' Felder');
  if (summe) teile.push('die Summe');
  if (!teile.length) return '';
  const satz = teile.length === 1 ? teile[0]
    : teile.slice(0, -1).join(', ') + ' und ' + teile[teile.length - 1];
  return 'Noch nicht richtig: ' + satz + '.';
}

// Baut aus den Namen der falschen Felder einen Satz, der ohne Farben auskommt.
function fehlermeldung(falsche) {
  if (falsche[0] === 'Stein') {
    return falsche.length === 1
      ? 'Ein Stein stimmt noch nicht.'
      : falsche.length + ' Steine stimmen noch nicht.';
  }
  if (falsche[0] === 'Feld') {
    return falsche.length === 1
      ? 'Ein Feld stimmt noch nicht.'
      : falsche.length + ' Felder stimmen noch nicht.';
  }
  if (falsche.length === 1) {
    return 'Noch nicht richtig: ' + falsche[0] + '.';
  }
  return 'Noch nicht richtig: ' + falsche.slice(0, -1).join(', ') + ' und ' + falsche[falsche.length - 1] + '.';
}

function melden(text, gut) {
  const feld = document.getElementById('rueckmeldung');
  feld.textContent = text;
  feld.className = 'rueckmeldung ' + (gut ? 'gut' : 'schlecht');
}

  blatt.innerHTML = `

    <div class="buehne">

  nameFeld.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('eintragen').click();
  });

  document.getElementById('ohneEintrag').addEventListener('click', () => {
    stand.ansicht = 'hub';
    stand.start = 0;
    stand.nummer = 0;
    zeichnen();
  });

  document.getElementById('eintragen').addEventListener('click', async () => {
    const name = nameFeld.value.trim() || 'Ohne Namen';

                      fehler: stand.fehler, uebersprungen: stand.uebersprungen,
                      datum: Date.now() };
    if (aktuelleOption() !== undefined) eintrag.option = aktuelleOption();
    stand.bestenliste.push(eintrag);

}

function zeichneRangliste(eintrag) {
  const spiel = SPIELE[eintrag.spiel];
  const liste = rangliste(eintrag.spiel, eintrag.stufe, eintrag.option);
  const platz = liste.findIndex(e => e === eintrag) + 1;
  const zeilen = liste.slice(0, 10).map((e, i) => `
    <tr class="${e === eintrag ? 'ich' : ''}">
      <td>${i + 1}</td><td>${entschaerfen(e.name)}</td><td class="zeit">${zeitText(e.ms)}</td>
      <td class="zeit">${fehlerText(e)}</td>
    </tr>`).join('');

  blatt.innerHTML = `
    <h1>Platz ${platz} von ${liste.length}</h1>
    <p class="unterzeile">${spiel.name}, Stufe „${stufenText(eintrag.spiel, eintrag.stufe, eintrag.option)}“.</p>
    <div class="liste">
      <table><thead><tr><th>Platz</th><th>Name</th><th class="zeit">Zeit</th>
        <th class="zeit">Fehler</th></tr></thead>
      <tbody>${zeilen}</tbody></table>
    </div>
    <div class="knopfreihe" style="margin-top:20px">
      <button class="haupt" id="nochmal">Noch eine Runde</button>
      <button class="schlicht" id="zurHub">Zur Übersicht</button>
    </div>`;

  document.getElementById('nochmal').addEventListener('click', () => {
    stand.ansicht = 'auswahl';
    stand.nummer = 0;
    stand.start = 0;
    zeichnen();
  });
  document.getElementById('zurHub').addEventListener('click', () => {
    stand.ansicht = 'hub';
    stand.start = 0;
    stand.nummer = 0;
    zeichnen();
  });
}

function fehlerText(eintrag) {
  if (typeof eintrag.fehler !== 'number') return '–';
  return eintrag.uebersprungen
    ? eintrag.fehler + ' (+' + eintrag.uebersprungen + ' ü)'
    : String(eintrag.fehler);
}

function entschaerfen(text) {
  return String(text).replace(/[&<>"']/g, z =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[z]));
}

// ============================================================
// Gemeinsamer Rechenblock fuer die schriftlichen Verfahren
// Darstellung, Uebertragskreise, Pruefung und Loesungsanzeige liegen hier,
// weil Addition und Subtraktion sie sich teilen.
// ============================================================

// Gemeinsame Darstellung fuer schriftliche Addition und Subtraktion.
function rechenblockFeld(hinweistext) {
  const a = stand.aufgabe;
  const breite = a.spalten * 50 + 4;
  const zelle = (inhalt) => `<div class="rzelle">${inhalt}</div>`;

  const zeilenHtml = a.zeilen.map((zif, i) => {
    const zeichen = i === a.zeilen.length - 1 ? a.zeichen : '';
    return `<div class="rzeile"><span class="rzeichen">${zeichen}</span>` +
      zif.map(z => zelle(z === ' ' ? '' : z)).join('') + '</div>';
  }).join('');

  const wortMerk = a.zeichen === '−' ? 'Merkzahl' : 'Übertrag';
  const kreise = a.zifS.map((_, j) => j === a.spalten - 1
    ? '<div class="rzelle ruebertrag"></div>'
    : `<div class="rzelle ruebertrag"><button type="button" class="ukreis"
         data-uebertrag="${j}" data-wert="0" data-max="${a.maxUebertrag}"
         aria-label="${wortMerk} in Spalte ${j + 1}"></button></div>`).join('');
  const kreisHinweis = a.maxUebertrag > 1
    ? 'Antippen zählt weiter: leer, 1, 2'
    : 'Antippen setzt die 1, nochmal tippen löscht sie';

  // Alle Ergebnisstellen ausser der Einerstelle duerfen leer bleiben, damit die
  // Anzahl der Felder nichts ueber die Laenge des Ergebnisses verraet.
  const zeileS = a.zifS.map((_, j) => zelle(
    `<input type="number" inputmode="numeric" data-feld="s${j}" data-frei="1" data-ziffer="links"
       aria-label="Ergebnisziffer Spalte ${j + 1}">`)).join('');

  return `<p class="aufgabentext">${hinweistext}</p>
    <div class="rechnung">
      ${zeilenHtml}
      <div class="rzeile"><span class="rzeichen"></span>${kreise}</div>
      <div class="rzeile"><span class="rzeichen"></span><div class="rstrich" style="width:${breite}px"></div></div>
      <div class="rzeile"><span class="rzeichen"></span>${zeileS}</div>
      <p class="uhinweis" style="width:${breite}px;margin-left:34px">${kreisHinweis}</p>
    </div>`;
}

// Die Uebertragskreise zaehlen beim Antippen weiter: leer, 1, 2, wieder leer.
function uebertragsKreiseBinden(ctx) {
  ctx.blatt.querySelectorAll('.ukreis').forEach(kreis => {
    kreis.addEventListener('click', () => {
      const max = Number(kreis.dataset.max || 1);
      const wert = (Number(kreis.dataset.wert || 0) + 1) % (max + 1);
      kreis.dataset.wert = wert;
      kreis.textContent = wert === 0 ? '' : String(wert);
      kreis.setAttribute('aria-pressed', wert === 0 ? 'false' : 'true');
      kreis.classList.remove('richtig', 'falsch');
    });
  });
}

// Prueft Ergebniszeile und Uebertragskreise. wort ist 'Übertrag' oder 'Merkzahl'.
function rechenblockPruefen(a, ctx, wort) {
    const falsche = [];
    const namen = a.zifS.map((_, j) => 's' + j);
    const gruppe = ctx.gruppePruefen(namen, a.zifS.join('').trim(), ctx.werte);
    if (gruppe.leer) return { offen: 'Es fehlt noch eine Eingabe.' };
    let uebertragFalsch = 0;
    a.uebertrag.forEach((soll, j) => {
      if (j === a.spalten - 1) return;
      const kreis = ctx.blatt.querySelector(`.ukreis[data-uebertrag="${j}"]`);
      if (!kreis) return;
      const richtig = Number(kreis.dataset.wert || 0) === soll;
      kreis.classList.add(richtig ? 'richtig' : 'falsch');
      if (!richtig) uebertragFalsch++;
    });
    if (!gruppe.richtig) falsche.push('Ziffer');
    if (uebertragFalsch) falsche.push('Übertrag');
    const hinweis = additionMeldung(gruppe.richtig ? 0 : 1, uebertragFalsch,
      wort);
    return { falsche, hinweis };
}

// Traegt Ziffern und Uebertraege als Loesung ein.
function rechenblockLoesung(a, ctx) {
  a.zifS.forEach((z, j) => {
    const feld = ctx.blatt.querySelector(`input[data-feld="s${j}"]`);
    if (!feld) return;
    feld.value = z === ' ' ? '' : z;
    feld.classList.remove('falsch');
    feld.classList.add('richtig');
    feld.disabled = true;
  });
    a.uebertrag.forEach((soll, j) => {
      const kreis = ctx.blatt.querySelector(`.ukreis[data-uebertrag="${j}"]`);
      if (!kreis) return;
      kreis.dataset.wert = soll;
      kreis.textContent = soll === 0 ? '' : String(soll);
      kreis.classList.remove('falsch');
      kreis.classList.add('richtig');
    });
}

function additionMeldung(ziffern, uebertraege, wort) {
  if (!ziffern && !uebertraege) return '';
  const mehrzahl = wort === 'Merkzahl' ? 'Merkzahlen' : 'Überträge';
  const einzahl = wort === 'Merkzahl' ? 'eine Merkzahl' : 'ein Übertrag';
  const teile = [];
  if (ziffern) teile.push(ziffern === 1 ? 'eine Ergebnisziffer' : ziffern + ' Ergebnisziffern');
  if (uebertraege) teile.push(uebertraege === 1 ? einzahl : uebertraege + ' ' + mehrzahl);
  const satz = teile.join(' und ');
  return 'Noch nicht richtig: ' + satz + '.';
}

// ============================================================
// Auswahl aus Karten
// Wird von allen Spielen benutzt, bei denen aus mehreren Bildern die passenden
// angetippt werden, also Würfelnetze und Formen erkennen.
// ============================================================

// loesung ist ein Feld aus true und false, je Karte eines.
function kartenPruefen(loesung, ctx, wort = 'Figur') {
  const falsche = [];
  const karten = [...ctx.blatt.querySelectorAll('.karte')];
  // Ohne Auswahl ist es noch keine Antwort, also auch kein Fehlversuch
  if (!karten.some(k => k.getAttribute('aria-pressed') === 'true')) {
    return { offen: 'Tippe zuerst eine ' + wort + ' an.' };
  }
  let daneben = 0, fehlend = 0;
  karten.forEach((karte, i) => {
    const gewaehlt = karte.getAttribute('aria-pressed') === 'true';
    const stimmt = gewaehlt === loesung[i];
    if (gewaehlt) karte.classList.add(stimmt ? 'richtig' : 'falsch');
    if (gewaehlt && !loesung[i]) daneben++;
    if (!gewaehlt && loesung[i]) fehlend++;
  });
  if (!daneben && !fehlend) return { falsche };

  falsche.push('die Auswahl');
  const hinweis = daneben && fehlend
    ? 'Eine Auswahl ist zu viel und eine fehlt noch.'
    : daneben
      ? (daneben === 1 ? 'Eine angetippte ' + wort + ' passt nicht.'
                       : daneben + ' angetippte ' + wort + 'en passen nicht.')
      : (fehlend === 1 ? 'Eine passende ' + wort + ' fehlt noch.'
                       : fehlend + ' passende ' + wort + 'en fehlen noch.');
  return { falsche, hinweis };
}

function kartenLoesung(loesung, ctx) {
  ctx.blatt.querySelectorAll('.karte').forEach((karte, i) => {
    karte.classList.remove('falsch');
    karte.setAttribute('aria-pressed', loesung[i] ? 'true' : 'false');
    if (loesung[i]) karte.classList.add('richtig');
  });
}


/* ----- kern/klickgitter.js ----- */
// ============================================================
// Klickgitter
// Gemeinsame Grundlage fuer Spiegeln und Vergroessern: ein Gitter aus
// Kaestchen, von denen einige vorgegeben und andere antippbar sind.
// ============================================================

function blobBauen(breite, hoehe, anzahl) {
  const zellen = [{ x: zufall(0, breite - 1), y: zufall(0, hoehe - 1) }];
  const drin = (x, y) => zellen.some(z => z.x === x && z.y === y);
  let schutz = 0;
  while (zellen.length < anzahl && schutz++ < 400) {
    const basis = zellen[zufall(0, zellen.length - 1)];
    const richtung = [[1, 0], [-1, 0], [0, 1], [0, -1]][zufall(0, 3)];
    const x = basis.x + richtung[0], y = basis.y + richtung[1];
    if (x < 0 || y < 0 || x >= breite || y >= hoehe || drin(x, y)) continue;
    zellen.push({ x, y });
  }
  return zellen;
}

function klickGitter(spalten, zeilen, feste, klickbereich, achse) {
  const k = 30, rand = 6;
  const drin = (liste, x, y) => liste.some(z => z.x === x && z.y === y);
  const zellen = [];
  for (let x = 0; x < spalten; x++) {
    for (let y = 0; y < zeilen; y++) {
      const px = rand + x * k, py = rand + (zeilen - 1 - y) * k;
      if (drin(feste, x, y)) {
        zellen.push(`<rect class="kaestchen fest" x="${px}" y="${py}" width="${k}" height="${k}"/>`);
      } else if (!klickbereich || klickbereich(x, y)) {
        zellen.push(`<rect class="kaestchen" x="${px}" y="${py}" width="${k}" height="${k}"
          data-x="${x}" data-y="${y}" role="button" tabindex="0"
          aria-label="Kästchen ${x + 1}, ${y + 1}"></rect>`);
      } else {
        zellen.push(`<rect class="kaestchen" x="${px}" y="${py}" width="${k}" height="${k}"
          style="cursor:default" fill="#fff"/>`);
      }
    }
  }
  const achsenlinie = achse === 'senkrecht'
    ? `<line class="achse" x1="${rand + spalten / 2 * k}" y1="${rand}"
        x2="${rand + spalten / 2 * k}" y2="${rand + zeilen * k}"/>`
    : achse === 'waagerecht'
      ? `<line class="achse" x1="${rand}" y1="${rand + zeilen / 2 * k}"
          x2="${rand + spalten * k}" y2="${rand + zeilen / 2 * k}"/>` : '';

  return `<svg viewBox="0 0 ${spalten * k + 2 * rand} ${zeilen * k + 2 * rand}"
      width="100%" style="max-width:${spalten * k + 2 * rand}px" role="application"
      aria-label="Gitter zum Antippen">${zellen.join('')}${achsenlinie}</svg>`;
}

// Kaestchen an- und abtippen
function kaestchenBinden(ctx) {
  ctx.blatt.querySelectorAll('.kaestchen[data-x]').forEach(feld => {
    const umschalten = () => {
      feld.classList.remove('richtig', 'falsch');
      feld.classList.toggle('gesetzt');
    };
    feld.addEventListener('click', umschalten);
    feld.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); umschalten(); }
    });
  });
}

// Vergleicht die gesetzten Kaestchen mit der Loesung.
function kaestchenPruefen(loesung, ctx) {
  const falsche = [];
  const soll = new Set(loesung.map(z => z.x + '|' + z.y));
  const gesetzt = [...ctx.blatt.querySelectorAll('.kaestchen.gesetzt')];
  if (!gesetzt.length) return { offen: 'Tippe zuerst ein Kästchen an.' };

  let daneben = 0;
  gesetzt.forEach(feld => {
    const stimmt = soll.has(feld.dataset.x + '|' + feld.dataset.y);
    feld.classList.add(stimmt ? 'richtig' : 'falsch');
    if (!stimmt) daneben++;
  });
  const fehlend = soll.size - (gesetzt.length - daneben);
  if (!daneben && !fehlend) return { falsche };

  falsche.push('die Figur');
  const hinweis = daneben && fehlend
    ? 'Ein Kästchen sitzt falsch und es fehlen noch welche.'
    : daneben
      ? (daneben === 1 ? 'Ein Kästchen sitzt falsch.' : daneben + ' Kästchen sitzen falsch.')
      : (fehlend === 1 ? 'Es fehlt noch ein Kästchen.' : 'Es fehlen noch ' + fehlend + ' Kästchen.');
  return { falsche, hinweis };
}

function kaestchenLoesung(loesung, ctx) {
  ctx.blatt.querySelectorAll('.kaestchen').forEach(k => k.classList.remove('gesetzt', 'falsch'));
  loesung.forEach(z => {
    const k = ctx.blatt.querySelector(`.kaestchen[data-x="${z.x}"][data-y="${z.y}"]`);
    if (k) k.classList.add('richtig');
  });
}

// ============================================================
// Diagnosemodus
// Ein Querschnitt durch die Grundschulthemen. Jedes Spiel beginnt auf seiner
// leichtesten Stufe und steigt nur auf, solange die Stufe sitzt. Gearbeitet wird
// in Runden: erst kommt von jedem Spiel die Einstiegsaufgabe, dann die naechste
// Stufe aller Spiele, die noch laufen. Bricht ein Kind ab, liegt so trotzdem fuer
// jeden Bereich ein Befund vor.
//
// Regeln
//   Punkte je Aufgabe:  im 1. oder 2. Versuch richtig = 1, im 3. = 0,5, sonst 0
//                       Ein Fehlversuch zaehlt nicht, das kann ein Tippfehler sein.
//   Gegenprobe:         Eine 0 wird einmal mit einer zweiten Aufgabe derselben
//                       Stufe ueberprueft, damit ein Ausrutscher nicht zaehlt.
//   Stufe bestanden:    Mittelwert der Aufgaben dieser Stufe mindestens 0,5
//   Abbruch:            Eine nicht bestandene Stufe beendet das Spiel.
//   Deckenaufgaben:     Laufen erst, wenn ihre Voraussetzungen bestanden sind.

const DIAGNOSE_PLAENE = {
