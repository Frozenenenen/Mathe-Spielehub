// ============================================================
// malzehn
// Hinweis: Die Pruefung ist hier neu geschrieben. Im Altbestand fehlte sie,
// vermutlich bei einer frueheren Umstellung verlorengegangen.
// ============================================================
function zehnerAufgabe(stufe, vorgabe) {
  const stufen = { 1: [10], 2: [10, 100, 1000], 3: [10, 100], 4: [10, 100, 1000] }[stufe];

  for (let versuch = 0; versuch < 300; versuch++) {
    // Stufe 5: Zehnerzahlen mit beliebiger erster Ziffer, also 20, 300, 5000
    const faktor = stufe === 5
      ? zufall(2, 9) * Math.pow(10, zufall(1, 3))
      : stufen[zufall(0, stufen.length - 1)];
    const malnehmen = vorgabe && vorgabe.malnehmen !== undefined
      ? vorgabe.malnehmen : zufall(0, 1) === 0;

    // Ausgangszahl: ganze Zahl oder Kommazahl
    let wert;
    if (stufe <= 2) {
      wert = zufall(2, 999) * 1000;
    } else if (stufe === 5) {
      // Hier geht es um die Zehnerpotenz, nicht ums Teilen grosser Zahlen.
      // Deshalb hat die Zahl hoechstens zwei bedeutsame Ziffern, der Rest sind Nullen.
      const kern = zufall(1, 3) === 1 ? zufall(2, 9) : zufall(11, 99);
      if (zufall(1, 3) === 1) {
        wert = kern * 100;                       // eine Nachkommastelle, etwa 7,3
      } else {
        const zehnerpotenz = faktor >= 1000 ? zufall(0, 1) : zufall(0, 2);
        wert = kern * Math.pow(10, zehnerpotenz) * 1000;
      }
    } else {
      const nachkommastellen = zufall(1, 2);
      const schritt = nachkommastellen === 1 ? 100 : 10;
      wert = zufall(2, 9990) * schritt;
      if (wert % 1000 === 0) continue;           // sonst waere es doch eine ganze Zahl
    }

    let a, ergebnis;
    if (malnehmen) {
      a = wert;
      ergebnis = wert * faktor;
    } else {
      // Beim Teilen wird die Aufgabe rueckwaerts gebaut. Das Ergebnis ist damit
      // immer eine glatt im Kopf zu rechnende Zahl, auch wenn sie ein Komma hat.
      ergebnis = wert;
      a = wert * faktor;
    }
    if (ergebnis <= 0 || a > 100000000 || ergebnis > 1000000000) continue;
    if (stufe <= 2 && ergebnis % 1000 !== 0) continue;   // ganze Zahlen bleiben ganz

    const aufgabe = {
      art: stufe === 4 ? 'luecke' : 'rechnen',
      a, faktor, malnehmen, ergebnis,
      zeichen: malnehmen ? '·' : ':',
      aText: tausendstelText(a, 3).replace(/,(\d*?)0+$/, (x, r) => r ? ',' + r : ''),
      ergebnisText: tausendstelText(ergebnis, 3).replace(/,(\d*?)0+$/, (x, r) => r ? ',' + r : '')
    };

    if (stufe === 4) {
      // Mal fehlt die Ausgangszahl, mal der Faktor
      aufgabe.gesucht = zufall(0, 1) === 0 ? 'zahl' : 'faktor';
      aufgabe.loesung = aufgabe.gesucht === 'zahl' ? a : faktor * 1000;
    } else {
      aufgabe.loesung = ergebnis;
    }
    return aufgabe;
  }
  return zehnerAufgabe(1, vorgabe);
}

function feldZehner() {
  const z = stand.aufgabe;
  const feld = (name, breite) => `<input type="text" inputmode="decimal" data-feld="${name}"
    style="width:${breite}px" aria-label="fehlende Zahl">`;

  if (z.art === 'luecke') {
    const zeile = z.gesucht === 'zahl'
      ? `${feld('wert', 150)}<span>${z.zeichen}</span><span>${z.faktor}</span>
         <span>=</span><span>${z.ergebnisText}</span>`
      : `<span>${z.aText}</span><span>${z.zeichen}</span>${feld('wert', 120)}
         <span>=</span><span>${z.ergebnisText}</span>`;
    return `<p class="aufgabentext">Welche Zahl gehört in die Lücke?</p>
      <div class="gleichung">${zeile}</div>`;
  }

  return `<p class="aufgabentext">Rechne aus. Achte darauf, wohin die Ziffern wandern.</p>
    <div class="gleichung">
      <span>${z.aText}</span><span>${z.zeichen}</span><span>${z.faktor}</span>
      <span>=</span>${feld('wert', 170)}
    </div>`;
}

    stufen: ['ganze Zahlen mit 10', '10, 100 und 1000', 'Kommazahlen', 'was fehlt?',
             'Vielfache wie 20 oder 5000'],
    klassen: [3, 4, 5, 5, 5],
    bild: `<svg viewBox="0 0 60 44" width="60" height="44" aria-hidden="true">

      <text x="30" y="36" text-anchor="middle" font-size="13" font-weight="bold" fill="#1D4ED8">= 47</text>
    </svg>`,

  aufgabe: zehnerAufgabe,

  pruefe(a, ctx) {
    const falsche = [];
    let hinweis = '';
    const eingabe = tausendstelAusEingabe(ctx.werte.wert);
    const richtig = eingabe === a.loesung;
    ctx.markieren('wert', richtig);
    if (!richtig) {
      falsche.push('das Ergebnis');
      // Der Klassiker: eine Null anhaengen statt das Komma zu verschieben
      if (a.art === 'rechnen' && eingabe === a.a) {
        hinweis = a.malnehmen
          ? 'Eine Null anzuhängen ändert bei einer Kommazahl nichts. Die Ziffern müssen eine Stelle nach vorn rücken.'
          : 'Beim Teilen durch 10 rücken die Ziffern eine Stelle zurück, eine Null wegzustreichen reicht nicht.';
      }
    }
    return { falsche, hinweis };
  },

  loesung(a, ctx) {
    const zahl = tausendstelText(a.loesung, 3).replace(/,(\d*?)0+$/, (x, r) => r ? ',' + r : '');
    felderEintragen({ wert: zahl }, ctx);
  }
});

spielAnmelden({
  id: 'mauer',
  name: 'Rechenmauer',
  beschreibung: 'Zwei Steine nebeneinander ergeben zusammen den Stein darüber. Fülle die leeren Felder.',
  stufen: ['3 Reihen, bis 20', '4 Reihen, bis 100', '5 Reihen, bis 200'],
  klassen: [1, 2, 3],
  bild: `<svg viewBox="0 0 60 44" width="60" height="44" aria-hidden="true">
      <g fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2">
        <rect x="4"  y="28" width="16" height="12" rx="2"/>
        <rect x="22" y="28" width="16" height="12" rx="2"/>
        <rect x="40" y="28" width="16" height="12" rx="2"/>
        <rect x="13" y="15" width="16" height="12" rx="2"/>
        <rect x="31" y="15" width="16" height="12" rx="2"/>
        <rect x="22" y="2"  width="16" height="12" rx="2" fill="#fff"/>

  stil: `

  .stein input.falsch  { background: var(--rot-hell);   box-shadow: inset 0 0 0 2px var(--rot); }`,

  aufgabe(stufe) {
    const einstellung = {
      1: { reihen: 3, maxGrund: 6,  maxSpitze: 20,  luecken: 2 },
      2: { reihen: 4, maxGrund: 9,  maxSpitze: 100, luecken: 4 },

    }[stufe];

    for (let versuch = 0; versuch < 400; versuch++) {
      const grund = [];
      for (let i = 0; i < einstellung.reihen; i++) grund.push(zufall(1, einstellung.maxGrund));
      const reihen = mauerAufbauen(grund);
      if (reihen[reihen.length - 1][0] > einstellung.maxSpitze) continue;

      const felder = [];
      reihen.forEach((reihe, r) => reihe.forEach((_, i) => felder.push(r + ':' + i)));
      for (let i = felder.length - 1; i > 0; i--) {
        const j = zufall(0, i);
        [felder[i], felder[j]] = [felder[j], felder[i]];
      }
      const versteckt = new Set(felder.slice(0, einstellung.luecken));
      const ergebnis = mauerPruefen(reihen, versteckt);
      // Ab Stufe 2 muss mindestens einmal rueckwaerts gerechnet werden.
      if (ergebnis.geloest && (stufe === 1 || ergebnis.subtraktionNoetig)) {
        return { reihen, versteckt };
      }
    }
    const reihen = mauerAufbauen([2, 3, 4]);
    return { reihen, versteckt: new Set(['1:0']) };
  },

  feld(a) {
    const zeilen = [];
    for (let r = a.reihen.length - 1; r >= 0; r--) {
      const steine = a.reihen[r].map((wert, i) => {
        const schluessel = r + ':' + i;
        return a.versteckt.has(schluessel)
          ? `<div class="stein luecke"><input type="number" inputmode="numeric"

          : `<div class="stein">${wert}</div>`;
      }).join('');
      zeilen.push(`<div class="mauerreihe">${steine}</div>`);
    }
    return `<p class="aufgabentext">Zwei Steine nebeneinander ergeben zusammen den Stein darüber.</p>
            <div class="mauer">${zeilen.join('')}</div>`;
  },

  pruefe(a, ctx) {
    const falsche = [];
    a.versteckt.forEach(schluessel => {
      const [r, i] = schluessel.split(':').map(Number);
      const richtig = Number(ctx.werte[schluessel]) === a.reihen[r][i];
      ctx.markieren(schluessel, richtig);
      if (!richtig) falsche.push('Stein');
    });
    return { falsche };
  },

  loesung(a, ctx) {
    a.versteckt.forEach(schluessel => {
      const [r, i] = schluessel.split(':').map(Number);
      const feld = ctx.blatt.querySelector(`input[data-feld="${schluessel}"]`);
      if (!feld) return;
      feld.value = a.reihen[r][i];
      feld.classList.remove('falsch');
      feld.classList.add('richtig');
      feld.disabled = true;
    });
  }
});

// ============================================================
// multiplikation
// ============================================================
function multiplikationAufgabe(stufe) {
  const plan = { 1: { da: 3, db: 1 }, 2: { da: 2, db: 2 },
                 3: { da: 3, db: 2 }, 4: { da: 3, db: 3 } }[stufe];
  const min = (n) => Math.pow(10, n - 1);
  const max = (n) => Math.pow(10, n) - 1;

  const a = zufall(min(plan.da), max(plan.da));
  // Der zweite Faktor bekommt keine Null, sonst waere ein Teilprodukt leer.
  let b;
  do { b = zufall(min(plan.db), max(plan.db)); } while (String(b).includes('0'));

  const produkt = a * b;
  const m = plan.da + plan.db;              // so viele Spalten hat das Ergebnis hoechstens
  const bZiffern = String(b).split('');

  const teile = bZiffern.map((ziffer, i) => {
    const stelle = plan.db - 1 - i;         // 0 = Einer, 1 = Zehner, ...
    const wert = a * Number(ziffer);
    const zellen = new Array(m).fill(' ');
    const text = String(wert);
    const ende = m - 1 - stelle;            // rechteste Spalte dieses Teilprodukts
    for (let k = 0; k < text.length; k++) zellen[ende - text.length + 1 + k] = text[k];
    return { ziffer: Number(ziffer), stelle, wert, zellen, ende };
  });

  return {
    a, b, produkt, spalten: m,
    zifA: String(a).padStart(m, ' ').split(''),
    teile,
    zifS: String(produkt).padStart(m, ' ').split(''),
    einzeln: plan.db === 1
  };
}

function feldMultiplikation() {
  const a = stand.aufgabe;
  const breite = a.spalten * 50 + 4;
  const zelle = (inhalt) => `<div class="rzelle">${inhalt}</div>`;

  // Aufgabenzeile im selben Zellenraster, aber linksbuendig ohne Leerspalten.
  // Auf dem Papier steht sie genauso am linken Rand, die Teilprodukte darunter
  // richten sich nach ihrem Stellenwert.
  const kopfZiffern = String(a.a).split('').map(z => zelle(z)).join('') +
    zelle('·') + String(a.b).split('').map(z => zelle(z)).join('');
  const kopfSpalten = String(a.a).length + 1 + String(a.b).length;
  const kopfBreite = kopfSpalten * 50 + 4;


  // Das Ergebnisraster steht rechtsbuendig unter der Aufgabe. Die Aufgabenzeile
  // ist genau eine Zelle breiter als das Ergebnis, naemlich die des Malzeichens,
  // deshalb ruecken Teilprodukte und Ergebnis um eine Zelle ein.
  const versatz = Math.max(0, kopfSpalten - a.spalten);
  const vorspann = zelle('').repeat(versatz);

  // Teilprodukte: Eingabefelder bis zur jeweiligen Endspalte
  const teilzeilen = a.teile.map((t, i) => {
    const zellen = [];
    for (let j = 0; j < a.spalten; j++) {
      if (j > t.ende) { zellen.push(zelle('')); continue; }
      zellen.push(zelle(`<input type="number" inputmode="numeric" data-feld="t${i}_${j}" data-frei="1" data-ziffer="links"
        aria-label="Teilprodukt ${i + 1}, Spalte ${j + 1}">`));
    }
    const zeichen = i === a.teile.length - 1 && a.teile.length > 1 ? '+' : '';
    return `<div class="rzeile"><span class="rzeichen">${zeichen}</span>${vorspann}${zellen.join('')}</div>`;
  }).join('');

  const zeileS = a.zifS.map((_, j) => zelle(
    `<input type="number" inputmode="numeric" data-feld="s${j}" data-frei="1" data-ziffer="links"
       aria-label="Ergebnisziffer Spalte ${j + 1}">`)).join('');

  const hinweis = a.einzeln
    ? 'Rechne Stelle für Stelle von rechts und trage das Ergebnis ein.'
    : 'Rechne für jede Ziffer des zweiten Faktors ein Teilprodukt. Die angehängten ' +
      'Nullen lässt du weg, dafür rückt jedes Teilprodukt eine Stelle nach links.';

  return `<p class="aufgabentext">${hinweis}</p>
    <div class="rechnung">
      <div class="rzeile"><span class="rzeichen"></span>${kopfZiffern}</div>
      <div class="rzeile"><span class="rzeichen"></span><div class="rstrich"
        style="width:${Math.max(breite, kopfBreite)}px"></div></div>
      ${a.einzeln ? '' : teilzeilen}
      ${a.einzeln ? '' : `<div class="rzeile"><span class="rzeichen"></span>${vorspann}<div class="rstrich" style="width:${breite}px"></div></div>`}

// ============================================================
// Würfelnetze
// Welche Figuren aus sechs Quadraten lassen sich zu einem Würfel falten?
// ============================================================
// ---------- Wuerfelnetze ----------
// Faltprobe: Der Wuerfel wird gedanklich ueber das Netz gerollt. Landen zwei
// Kaestchen auf derselben Seite, ist es kein Netz.
function istWuerfelnetz(zellen) {
  if (zellen.length !== 6) return false;
  const schluessel = (z) => z.x + ',' + z.y;
  const menge = new Map(zellen.map(z => [schluessel(z), z]));
  const kreuz = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const start = zellen[0];
  const belegt = new Map();
  const gesehen = new Set([schluessel(start)]);
  const warteschlange = [{ z: start, n: [0, 0, 1], o: [0, 1, 0] }];
  belegt.set([0, 0, 1].join(), schluessel(start));

  while (warteschlange.length) {
    const { z, n, o } = warteschlange.shift();
    const r = kreuz(o, n);
    const schritte = [
      { dx: 1,  dy: 0,  n2: r,                 o2: o },
      { dx: -1, dy: 0,  n2: r.map(v => -v),    o2: o },
      { dx: 0,  dy: 1,  n2: o,                 o2: n.map(v => -v) },
      { dx: 0,  dy: -1, n2: o.map(v => -v),    o2: n }
    ];
    for (const sch of schritte) {
      const nachbar = { x: z.x + sch.dx, y: z.y + sch.dy };
      const k = schluessel(nachbar);
      if (!menge.has(k) || gesehen.has(k)) continue;
      const seite = sch.n2.join();
      if (belegt.has(seite)) return false;      // zwei Kaestchen auf derselben Seite
      belegt.set(seite, k);
      gesehen.add(k);
      warteschlange.push({ z: menge.get(k), n: sch.n2, o: sch.o2 });
    }
  }
  return gesehen.size === 6 && belegt.size === 6;
}

function zufallsHexomino() {
  return blobBauen(4, 4, 6);
}

function netzeAufgabe(stufe) {
  const anzahl = { 1: 3, 2: 4, 3: 5 }[stufe];
  const zielNetze = zufall(1, Math.min(2, anzahl - 1));   // mindestens eins, nie alle

  // Gleiche Figur nicht zweimal zeigen, auch nicht verschoben
  const schluessel = (zellen) => {
    const minX = Math.min.apply(null, zellen.map(z => z.x));
    const minY = Math.min.apply(null, zellen.map(z => z.y));
    return zellen.map(z => (z.x - minX) + ',' + (z.y - minY)).sort().join(' ');
  };

  const netze = [], nichtNetze = [];
  const gesehen = new Set();
  let schutz = 0;
  while ((netze.length < zielNetze || nichtNetze.length < anzahl - zielNetze) && schutz++ < 20000) {
    const zellen = zufallsHexomino();
    if (zellen.length !== 6) continue;
    const k = schluessel(zellen);
    if (gesehen.has(k)) continue;
    gesehen.add(k);
    if (istWuerfelnetz(zellen)) {
      if (netze.length < zielNetze) netze.push({ zellen, istNetz: true });
    } else if (nichtNetze.length < anzahl - zielNetze) {
      nichtNetze.push({ zellen, istNetz: false });
    }
  }

  const karten = netze.concat(nichtNetze);
  for (let i = karten.length - 1; i > 0; i--) {
    const j = zufall(0, i);
    [karten[i], karten[j]] = [karten[j], karten[i]];
  }
  return { karten, loesung: karten.map(k => k.istNetz) };
}

// Zeichnet ein Hexomino als kleine Karte
function netzBild(zellen) {
  const k = 22, rand = 4;
  const maxX = Math.max.apply(null, zellen.map(z => z.x));
  const maxY = Math.max.apply(null, zellen.map(z => z.y));
  const felder = zellen.map(z =>
    `<rect x="${rand + z.x * k}" y="${rand + (maxY - z.y) * k}" width="${k}" height="${k}"
       fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>`).join('');
  return `<svg viewBox="0 0 ${(maxX + 1) * k + 2 * rand} ${(maxY + 1) * k + 2 * rand}"
      width="${(maxX + 1) * k + 2 * rand}" height="${(maxY + 1) * k + 2 * rand}"
      aria-hidden="true">${felder}</svg>`;
}

// ============================================================
// platzhalter

function platzhalterAufgabe(stufe) {
  let a, b, c, op;

  if (stufe === 1) {
    op = '+';
    a = zufall(1, 12);
    b = zufall(1, 20 - a);
    c = a + b;
  } else if (stufe === 2) {
    op = zufall(0, 1) === 0 ? '+' : '−';
    if (op === '+') {
      a = zufall(5, 80);
      b = zufall(5, 100 - a);
      c = a + b;
    } else {
      a = zufall(20, 100);
      b = zufall(5, a - 5);
      c = a - b;
    }
  } else {
    const ops = ['+', '−', '·', ':'];
    op = ops[zufall(0, 3)];
    if (op === '+') {
      a = zufall(50, 500);
      b = zufall(50, 500);
      c = a + b;
    } else if (op === '−') {
      a = zufall(100, 900);
      b = zufall(20, a - 20);
      c = a - b;
    } else if (op === '·') {
      a = zufall(2, 10);
      b = zufall(2, 10);
      c = a * b;
    } else {
      b = zufall(2, 10);
      c = zufall(2, 10);
      a = b * c;
    }
  }

  return { a, op, b, c, luecke: zufall(0, 1) === 0 ? 'a' : 'b' };
}

// ============================================================
function preistabelleAufgabe(stufe) {
  const einzelpreis = stufe === 1 ? zufall(1, 9) * 100 : zufall(3, 24) * 25;
  const mengen = [];
  while (mengen.length < 4) {
    const m = zufall(2, 12);
    if (!mengen.includes(m)) mengen.push(m);
  }
  mengen.sort((a, b) => a - b);
  if (stufe < 3) mengen[0] = 1;            // Einzelpreis steht als Anker in der Tabelle

  const zeilen = mengen.map(m => ({ menge: m, preis: m * einzelpreis }));
  const anzahlLuecken = stufe === 1 ? 2 : 3;

  const moeglich = [];
  for (let i = (stufe < 3 ? 1 : 0); i < zeilen.length; i++) moeglich.push(i);
  for (let i = moeglich.length - 1; i > 0; i--) {
    const j = zufall(0, i);
    [moeglich[i], moeglich[j]] = [moeglich[j], moeglich[i]];
  }
  // Auf den ersten beiden Stufen ist die Zeile mit einem Stueck der Anker, dort
  // duerfen alle uebrigen Zeilen Luecken sein. Auf Stufe 3 muss eine stehen bleiben.
  const hoechstens = stufe < 3 ? moeglich.length : moeglich.length - 1;
  const luecken = new Set(moeglich.slice(0, Math.min(anzahlLuecken, hoechstens)));
  return { einzelpreis, zeilen, luecken, ware: waren1() };
}

  const p = stand.aufgabe;

        : geldText(z.preis)}</td>

  return `<p class="aufgabentext">Der Preis für ${p.ware} hängt gleichmäßig von der Menge ab.

// ============================================================
// rueckgeld
// ============================================================
function waren1() {
  return WAREN[zufall(0, WAREN.length - 1)];
}

function rueckgeldAufgabe(stufe) {
  const scheine = [500, 1000, 2000, 5000];

  if (stufe === 1) {
    // glatte Eurobetraege, bezahlt mit einem Schein
    const preis = zufall(1, 17) * 100;
    const schein = scheine.find(s => s > preis);
    return { art: 'einfach', posten: [{ name: waren1(), preis }], summe: preis,
             schein, rueckgeld: schein - preis };
  }

  if (stufe === 2) {
    // Preise in Fuenf-Cent-Schritten, sonst wirkt der Kassenzettel erfunden
    const preis = zufall(24, 380) * 5;
    const schein = scheine.find(s => s > preis);
    return { art: 'cent', posten: [{ name: waren1(), preis }], summe: preis,
             schein, rueckgeld: schein - preis };
  }

  // mehrere Posten, erst zusammenrechnen, dann Rueckgeld
  const anzahl = zufall(2, 3);
  const posten = [];
  const genommen = new Set();
  let summe = 0;
  for (let i = 0; i < anzahl; i++) {
    let name;
    do { name = waren1(); } while (genommen.has(name));
    genommen.add(name);
    const preis = zufall(9, 240) * 5;
    posten.push({ name, preis });
    summe += preis;
  }
  const schein = scheine.find(s => s > summe) || 5000;
  return { art: 'summe', posten, summe, schein, rueckgeld: schein - summe };
}

function feldRueckgeld() {
  const r = stand.aufgabe;
  const zeilen = r.posten.map(p =>
    `<div class="kassenzeile"><span>${p.name}</span><span class="preis">${geldText(p.preis)}</span></div>`
  ).join('');

  const summenfeld = r.art === 'summe' ? `
    <div class="geldeingabe"><span class="wort">Zusammen:</span>
      <input type="number" inputmode="numeric" data-feld="summeEuro" aria-label="Summe in Euro">
      <span class="wort">Euro</span>
      <input type="number" inputmode="numeric" data-feld="summeCent" aria-label="Summe in Cent">
      <span class="wort">Cent</span>
    </div>` : '';

  const eingabe = r.art === 'einfach'
    ? `<div class="geldeingabe"><span class="wort">Rückgeld:</span>
         <input type="number" inputmode="numeric" data-feld="euro" aria-label="Rückgeld in Euro">
         <span class="wort">Euro</span></div>`
    : `<div class="geldeingabe"><span class="wort">Rückgeld:</span>
         <input type="number" inputmode="numeric" data-feld="euro" aria-label="Rückgeld in Euro">
         <span class="wort">Euro</span>
         <input type="number" inputmode="numeric" data-feld="cent" aria-label="Rückgeld in Cent">
         <span class="wort">Cent</span></div>`;

  return `<p class="aufgabentext">${r.posten.length > 1
      ? 'Rechne zuerst zusammen, was alles kostet.' : 'Was bekommst du zurück?'}
    Bezahlt wird mit <strong>${geldText(r.schein)}</strong>.</p>
    <div class="kasse">${zeilen}</div>
    ${summenfeld}
    ${eingabe}`;
}

      const euro = Number(ctx.werte[euroFeld]);
      const cent = centFeld ? Number(ctx.werte[centFeld]) : 0;
      const betrag = euro * 100 + cent;
      // Euro und Cent werden einzeln markiert, damit man sieht, welcher Teil nicht stimmt
      const euroRichtig = euro === Math.floor(soll / 100);
      const centRichtig = !centFeld || cent === soll % 100;
      ctx.markieren(euroFeld, euroRichtig);
      if (centFeld) ctx.markieren(centFeld, centRichtig);
      if (euroRichtig && centRichtig) return;
      falsche.push(wort);
      if (betrag === soll) hinweis = 'Der Betrag stimmt, aber die Cent müssen kleiner als 100 sein.';
    };
    if (r.art === 'summe') pruefeBetrag('summeEuro', 'summeCent', r.summe, 'die Summe');
    pruefeBetrag('euro', r.art === 'einfach' ? null : 'cent', r.rueckgeld, 'das Rückgeld');
    return { falsche, hinweis };
  },

  loesung(a, ctx) {
    const werte = {};
    if (a.art === 'summe') {
      werte.summeEuro = Math.floor(a.summe / 100); werte.summeCent = a.summe % 100;
    }
    werte.euro = Math.floor(a.rueckgeld / 100);
    if (a.art !== 'einfach') werte.cent = a.rueckgeld % 100;
    felderEintragen(werte, ctx);
  }
});

  { name: 'Tausender',   wert: 1000000, stellen: 0 },
  { name: 'Hunderter',   wert: 100000,  stellen: 0 },
  { name: 'Zehner',      wert: 10000,   stellen: 0 },
  { name: 'Einer',       wert: 1000,    stellen: 0 },
  { name: 'Zehntel',     wert: 100,     stellen: 1 },
  { name: 'Hundertstel', wert: 10,      stellen: 2 },
  { name: 'Tausendstel', wert: 1,       stellen: 3 }
];

function rundeAuf(zahl, stelle) {
  return Math.round(zahl / stelle) * stelle;
}

function zifferListe(wert, nachkommastellen) {
  const ganz = String(Math.floor(wert / 1000));
  const liste = ganz.split('').map((z, i) => ({
    zeichen: z, wert: Math.pow(10, ganz.length - 1 - i) * 1000
  }));
  if (nachkommastellen > 0) {
    liste.push({ zeichen: ',', wert: null });
    const rest = String(wert % 1000).padStart(3, '0').slice(0, nachkommastellen);
    rest.split('').forEach((z, i) => liste.push({ zeichen: z, wert: Math.pow(10, 2 - i) }));
  }
  return liste;
}

function rundenAufgabe(stufe, vorgabe) {
  if (stufe === 2) {
    const a = zufall(120, 880), b = zufall(120, 880);
    return { art: 'ueberschlag', a, b, stelle: 100,
             ra: rundeAuf(a, 100), rb: rundeAuf(b, 100),
             summe: rundeAuf(a, 100) + rundeAuf(b, 100) };
  }

  const erlaubt = {
    1: ['Zehner'],
    3: ['Hunderter', 'Tausender'],
    4: ['Zehntel', 'Hundertstel'],
    5: ['Tausender', 'Hunderter', 'Zehner', 'Einer', 'Zehntel', 'Hundertstel']
  }[stufe];
  const nachkommastellen = stufe <= 3 ? 0 : 3;

  for (let versuch = 0; versuch < 400; versuch++) {
    const zielName = erlaubt[zufall(0, erlaubt.length - 1)];
    const zielIdx = RUNDUNGSSTELLEN.findIndex(st => st.name === zielName);
    const ziel = RUNDUNGSSTELLEN[zielIdx];
    const entscheid = RUNDUNGSSTELLEN[zielIdx + 1];

    const wert = nachkommastellen === 0
      ? zufall(Math.max(ziel.wert / 1000, 10), 9999) * 1000
      : zufall(1, 9999) * 1000 + zufall(0, 999);

    if (wert < ziel.wert) continue;
    if (wert % ziel.wert === 0) continue;          // waere schon fertig gerundet
    const geloest = Math.round(wert / ziel.wert) * ziel.wert;
    if (geloest <= 0) continue;

    const ziffern = zifferListe(wert, nachkommastellen);
    const zielPos = ziffern.findIndex(z => z.wert === ziel.wert);
    const entscheidPos = ziffern.findIndex(z => z.wert === entscheid.wert);
    if (zielPos < 0 || entscheidPos < 0) continue;

    return {
      art: 'runden', wert, ziel, entscheid, ziffern, zielPos, entscheidPos,
      markieren: !(vorgabe && vorgabe.ohneMarkieren),
      nachkommastellen,
      text: tausendstelText(wert, nachkommastellen),
      loesung: geloest,
      loesungText: tausendstelText(geloest, ziel.stellen)
    };
  }
  return rundenAufgabe(1, vorgabe);
}

}

// ============================================================
// schriftdivision
// ============================================================
function inZellen(text, m, ende) {
  const zellen = new Array(m).fill(' ');
  for (let k = 0; k < text.length; k++) zellen[ende - text.length + 1 + k] = text[k];
  return zellen;
}

function schriftdivisionAufgabe(stufe) {
  const plan = {
    1: { stellen: 3, divisor: [2, 9],   mitRest: false },
    2: { stellen: 3, divisor: [2, 9],   mitRest: true },
    3: { stellen: 4, divisor: [2, 9],   mitRest: true },
    4: { stellen: 4, divisor: [11, 25], mitRest: true }
  }[stufe];

  const min = Math.pow(10, plan.stellen - 1);
  const max = Math.pow(10, plan.stellen) - 1;

  for (let versuch = 0; versuch < 500; versuch++) {
    const divisor = zufall(plan.divisor[0], plan.divisor[1]);
    const dividend = zufall(min, max);
    if (!plan.mitRest && dividend % divisor !== 0) continue;

    const zifD = String(dividend).split('');
    const m = plan.stellen;
    const restBreite = String(plan.divisor[1]).length;
    const produktBreite = restBreite + 1;

    // Wie viele Ziffern braucht der erste Schritt?
    let start = 0, anfang = 0;
    while (start < m) {
      anfang = anfang * 10 + Number(zifD[start]);
      start++;
      if (anfang >= divisor) break;
    }
    if (anfang < divisor) continue;          // Divisor passt nirgends hinein

    const schritte = [];
    let uebrig = anfang;
    for (let spalte = start - 1; spalte < m; spalte++) {
      if (spalte > start - 1) uebrig = uebrig * 10 + Number(zifD[spalte]);
      const qZiffer = Math.floor(uebrig / divisor);
      const produkt = qZiffer * divisor;
      const restWert = uebrig - produkt;
      schritte.push({
        spalte, qZiffer, produkt, restWert,
        produktZellen: inZellen(String(produkt), m, spalte),
        restZellen: inZellen(String(restWert), m, spalte),
        herunter: spalte + 1 < m ? zifD[spalte + 1] : null
      });
      uebrig = restWert;
    }

    const quotient = Math.floor(dividend / divisor);
    const zifQ = new Array(m).fill(' ');
    schritte.forEach(sch => { zifQ[sch.spalte] = String(sch.qZiffer); });

    return { dividend, divisor, quotient, rest: uebrig, spalten: m,
             zifD, zifQ, schritte, produktBreite, restBreite, ersteSpalte: start - 1 };
  }
  return null;
}

function feldSchriftdivision() {
  const d = stand.aufgabe;
  const zelle = (inhalt, klasse) => `<div class="rzelle${klasse ? ' ' + klasse : ''}">${inhalt}</div>`;

  // Kopfzeile: Dividend, Doppelpunkt, Divisor, Gleichheitszeichen, Ergebnisfelder
  const kopf = d.zifD.map(z => zelle(z)).join('') +
    zelle(':') + String(d.divisor).split('').map(z => zelle(z)).join('') + zelle('=') +
    d.zifQ.map((_, j) => zelle(
      `<input type="number" inputmode="numeric" data-feld="q${j}" data-frei="1" data-ziffer="rechts"
         aria-label="Ergebnisziffer ${j + 1}">`)).join('');

  const zeilen = d.schritte.map((sch, i) => {
    const pVon = Math.max(0, sch.spalte - d.produktBreite + 1);
    const produkt = [];
    for (let j = 0; j < d.spalten; j++) {
      if (j < pVon || j > sch.spalte) { produkt.push(zelle('')); continue; }
      produkt.push(zelle(`<input type="number" inputmode="numeric" data-feld="p${i}_${j}" data-frei="1" data-ziffer="rechts"
        aria-label="Abzuziehende Zahl, Schritt ${i + 1}, Spalte ${j + 1}">`, 'unterstrich'));
    }

    const rVon = Math.max(0, sch.spalte - d.restBreite + 1);
    const rest = [];
    for (let j = 0; j < d.spalten; j++) {
      if (j === sch.spalte + 1 && sch.herunter !== null) {
        rest.push(zelle(sch.herunter, 'klein'));         // heruntergeholte Ziffer
      } else if (j < rVon || j > sch.spalte) {
        rest.push(zelle(''));
      } else {
        rest.push(zelle(`<input type="number" inputmode="numeric" data-feld="r${i}_${j}" data-frei="1" data-ziffer="links"
          aria-label="Rest nach Schritt ${i + 1}, Spalte ${j + 1}">`));
      }
    }

    return `<div class="rzeile"><span class="rzeichen">−</span>${produkt.join('')}</div>
            <div class="rzeile"><span class="rzeichen"></span>${rest.join('')}</div>`;
  }).join('');

  return `<p class="aufgabentext">Rechne von links nach rechts: Wie oft passt der Divisor hinein,
    malnehmen, abziehen, nächste Ziffer herunterholen. Die kleinen Ziffern sind schon
    heruntergeholt.</p>
    <div class="rechnung">
      <div class="rzeile"><span class="rzeichen"></span>${kopf}</div>
      ${zeilen}
    </div>`;
}

      const gR = gruppePruefen(namenR, String(sch.restWert), ctx.werte);
      if (gR.leer) offen = true; else if (!gR.richtig) schemaFalsch++;
    });

    if (offen) return { offen: 'Es fehlt noch eine Eingabe.' };
    if (ergebnisFalsch) falsche.push('Ergebnis');
    if (schemaFalsch) falsche.push('Schema');
    hinweis = divisionMeldung(ergebnisFalsch, schemaFalsch);
    return { falsche, hinweis };
  },

  loesung(a, ctx) {
    const werte = {};
    a.zifQ.forEach((z, j) => { werte['q' + j] = z === ' ' ? '' : z; });
    a.schritte.forEach((sch, i) => {
      const pVon = Math.max(0, sch.spalte - a.produktBreite + 1);
      for (let j = pVon; j <= sch.spalte; j++)
        werte['p' + i + '_' + j] = sch.produktZellen[j] === ' ' ? '' : sch.produktZellen[j];
      const rVon = Math.max(0, sch.spalte - a.restBreite + 1);
      for (let j = rVon; j <= sch.spalte; j++)
        werte['r' + i + '_' + j] = sch.restZellen[j] === ' ' ? '' : sch.restZellen[j];
    });
    felderEintragen(werte, ctx);
  }
});

// ============================================================
// stellenwert
// ============================================================
function zahlMitPunkten(zahl) {
  return String(zahl).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function stellenwertAufgabe(stufe, vorgabe) {
  const plan = STELLENPLAN[stufe];
  const spalten = plan.spalten.map(n => STELLEN[n]);
  const ersteNachkomma = plan.spalten.findIndex(n => n === n.toLowerCase());

  for (let versuch = 0; versuch < 200; versuch++) {
    const laenge = zufall(plan.laenge[0], plan.laenge[1]);
    let beginn, ende;
    if (plan.komma) {
      beginn = zufall(0, spalten.length - laenge);
      ende = beginn + laenge - 1;
      // Wenigstens eine Nachkommastelle, und die Einerstelle gehoert immer dazu
      if (ende < ersteNachkomma) continue;
      if (beginn > ersteNachkomma - 1) continue;
    } else {
      // Ganze Zahlen enden immer bei den Einern, sonst bliebe die Spalte leer
      ende = spalten.length - 1;
      beginn = ende - laenge + 1;
      if (beginn < 0) continue;
    }

    // Jede Spalte bekommt eine Ziffer. Ausserhalb der eigentlichen Zahl ist das
    // eine Null, so wie man es in der Stellenwerttafel auch schreibt.
    const ziffern = spalten.map(() => 0);
    for (let i = beginn; i <= ende; i++) {
      ziffern[i] = (i === beginn) ? zufall(1, 9) : zufall(0, 9);
    }
    // Eine Null mitten in der Zahl ist der lehrreiche Fall
    if (laenge > 2 && zufall(1, 3) !== 1) ziffern[zufall(beginn + 1, ende - 1)] = 0;

    const wert = ziffern.reduce((summe, z, i) => summe + z * spalten[i].wert, 0);
    if (wert <= 0) continue;

    // So viele Nachkommastellen, wie die Zahl tatsaechlich belegt
    const nachkomma = ersteNachkomma < 0 ? 0 : Math.max(0, ende - ersteNachkomma + 1);

    // Drei Arten: Tafel ausfuellen, Zahl ablesen, oder einzelne Stellen abfragen
    const arten = ['zerlegen', 'zusammensetzen', 'abfragen'];
    const art = (vorgabe && vorgabe.art) || arten[zufall(0, 2)];

    // Fuer die Abfrage ein paar Stellen der Zahl in zufaelliger Reihenfolge.
    // Gefragt wird nur nach Stellen, die die Zahl wirklich hat.
    const reihenfolge = spalten.map((_, i) => i).filter(i => i >= beginn && i <= ende);
    for (let i = reihenfolge.length - 1; i > 0; i--) {
      const j = zufall(0, i);
      [reihenfolge[i], reihenfolge[j]] = [reihenfolge[j], reihenfolge[i]];
    }
    const fragen = reihenfolge.slice(0, Math.min(4, reihenfolge.length));

    return {
      art,
      fragen,
      wert, spalten, ziffern, nachkomma,
      kommaSpalte: ersteNachkomma - 1,        // hinter dieser Spalte steht das Komma
      hatKomma: plan.komma,
      // Nullen am Ende der Nachkommastellen gehoeren nicht in die Anzeige:
      // 809,0 schreibt man als 809.
      text: tausendstelText(wert, nachkomma).replace(/,(\d*?)0+$/, (t, rest) => rest ? ',' + rest : '')
    };
  }
  return stellenwertAufgabe(1, vorgabe);
}

function feldStellenwert() {
  const t = stand.aufgabe;
  const kommaZelle = (i) => t.hatKomma && i === t.kommaSpalte
    ? '<td style="border:none;padding:0 4px">,</td>' : '';
  const kommaKopf = (i) => t.hatKomma && i === t.kommaSpalte
    ? '<th style="padding:0 4px"></th>' : '';

          aria-label="Ziffer bei ${t.spalten[i].name}">

      <span class="swzahl">${t.text}</span> an welcher Stelle?</p>

  }

  if (t.art === 'zerlegen') {
    const zellen = t.spalten.map((sp, i) =>
      `<td><input type="number" inputmode="numeric" data-feld="z${i}" data-ziffer="rechts"
         aria-label="Ziffer bei ${sp.kurz}"></td>` + kommaZelle(i)).join('');
    return `<p class="aufgabentext">Trage die Zahl <span class="swzahl">${t.text}</span>
      in die Stellenwerttafel ein. Jede Spalte wird ausgefüllt, Stellen ohne Wert
      bekommen eine Null.</p>
      <div class="tafelrahmen"><table class="swtafel"><tr>${kopf}</tr><tr>${zellen}</tr></table></div>`;
  }

  const zellen = t.spalten.map((sp, i) =>
    `<td>${t.ziffern[i]}</td>` + kommaZelle(i)).join('');
  return `<p class="aufgabentext">Welche Zahl steht in der Stellenwerttafel?</p>
    <div class="tafelrahmen"><table class="swtafel"><tr>${kopf}</tr><tr>${zellen}</tr></table></div>
    <div class="geldeingabe">
      <input type="text" inputmode="decimal" data-feld="zahl" style="width:180px"
        aria-label="Zahl"></div>
    ${t.nachkomma ? `<p class="aufgabentext" style="font-size:15px;color:var(--grau)">
      Schreibe die Zahl mit Komma, zum Beispiel 304,05.</p>` : ''}`;
}

// strahl
// ============================================================
function strahlAufgabe(stufe) {
  const einstellung = {
    1: { bis: 20,   schritt: 1,  beschriftet: 5 },
    2: { bis: 100,  schritt: 5,  beschriftet: 10 },
    3: { bis: 1000, schritt: 50, beschriftet: 100 }
  }[stufe];
  const anzahl = einstellung.bis / einstellung.schritt;
  let wert;
  do {
    wert = zufall(1, anzahl - 1) * einstellung.schritt;
  } while (wert % einstellung.beschriftet === 0);
  return { wert, ...einstellung };
}

function feldStrahl() {
  const { wert, bis, schritt, beschriftet } = stand.aufgabe;
  const breite = 660, links = 40, laenge = 580;
  const x = wert => links + (wert / bis) * laenge;
  const striche = [];
  for (let w = 0; w <= bis; w += schritt) {
    const gross = w % beschriftet === 0;
    striche.push(`<line x1="${x(w)}" y1="${gross ? 32 : 38}" x2="${x(w)}" y2="${gross ? 58 : 52}"
      stroke="#16263F" stroke-width="${gross ? 2.4 : 1.4}"/>`);
    if (gross) striche.push(`<text x="${x(w)}" y="76" text-anchor="middle" font-size="15" fill="#16263F">${w}</text>`);
  }
  return `<p class="aufgabentext">Welche Zahl gehört zum orangefarbenen Punkt?</p>
    <svg viewBox="0 0 ${breite} 95" width="100%" style="max-width:660px" role="img"
      aria-label="Zahlenstrahl von 0 bis ${bis}">
      <line x1="${links - 20}" y1="45" x2="${links + laenge + 26}" y2="45" stroke="#16263F" stroke-width="2.4"/>
      ${striche.join('')}
      <circle cx="${x(wert)}" cy="45" r="8" fill="#EA580C"/>
    </svg>
    <input type="number" inputmode="numeric" data-feld="wert" aria-label="Zahl" style="width:120px">`;
}

// ============================================================
// Schriftlich subtrahieren
// ============================================================
// Abziehverfahren mit Entbuendeln. entbuendelt[j] = 1 bedeutet: In Spalte j
// bekommt der Subtrahend eine Eins dazu, weil daneben entbuendelt wurde.
function subtraktionAufgabe(stufe) {
  const plan = {
    1: { stellen: 2, nullen: false },
    2: { stellen: 3, nullen: false },
    3: { stellen: 3, nullen: true },
    4: { stellen: 4, nullen: false }
  }[stufe];
  const min = Math.pow(10, plan.stellen - 1);
  const max = Math.pow(10, plan.stellen) - 1;

  let a, b, versuche = 0;
  do {
    a = zufall(min + 10, max);
    b = zufall(min, a - 1);
    versuche++;
    // Stufe 3 will ausdruecklich Nullen im Minuenden, dort haeufen sich die Fehler.
    var passt = plan.nullen ? String(a).includes('0') : true;
  } while (versuche < 200 && !passt);

  const differenz = a - b;
  const m = plan.stellen;
  const ziffern = (zahl) => String(zahl).padStart(m, ' ').split('');
  const zifA = ziffern(a), zifB = ziffern(b), zifD = ziffern(differenz);
  const wert = (z) => z === ' ' ? 0 : Number(z);

  const entbuendelt = new Array(m).fill(0);
  let leihen = 0;
  for (let j = m - 1; j >= 0; j--) {
    const oben = wert(zifA[j]);
    const unten = wert(zifB[j]) + leihen;
    if (oben < unten) { leihen = 1; if (j > 0) entbuendelt[j - 1] = 1; }
    else leihen = 0;
  }

  return { a, b, differenz, zeilen: [zifA, zifB], zifS: zifD, uebertrag: entbuendelt,
           spalten: m, maxUebertrag: 1, zeichen: '−' };
}

// ============================================================
// symmetrie
// ============================================================
function symmetrieAufgabe(stufe) {
  const plan = { 1: { seite: 4, anzahl: 4, achse: 'senkrecht' },
                 2: { seite: 5, anzahl: 6, achse: 'senkrecht' },
                 3: { seite: 5, anzahl: 6, achse: 'waagerecht' } }[stufe];
  const s2 = plan.seite;

  if (plan.achse === 'senkrecht') {
    const vorlage = blobBauen(s2, s2, plan.anzahl);
    const gespiegelt = vorlage.map(z => ({ x: 2 * s2 - 1 - z.x, y: z.y }));
    return { achse: 'senkrecht', spalten: 2 * s2, zeilen: s2, vorlage, loesung: gespiegelt };
  }
  const vorlage = blobBauen(s2, s2, plan.anzahl);
  const gespiegelt = vorlage.map(z => ({ x: z.x, y: 2 * s2 - 1 - z.y }));
  return { achse: 'waagerecht', spalten: s2, zeilen: 2 * s2, vorlage, loesung: gespiegelt };
}

function feldSymmetrie() {
  const sy = stand.aufgabe;
  const klickbar = sy.achse === 'senkrecht'
    ? (x) => x >= sy.spalten / 2
    : (x, y) => y < sy.zeilen / 2;
  return `<p class="aufgabentext">Spiegle die Figur an der gestrichelten Achse.
    Tippe die Kästchen an, nochmal tippen nimmt sie wieder weg.</p>
    ${klickGitter(sy.spalten, sy.zeilen, sy.vorlage, klickbar, sy.achse)}`;
}

// ============================================================
// tafel
// ============================================================
function tafelFelder(aufgabe) {
  const felder = [];
  for (let dr = 0; dr < 3; dr++) {
    for (let dc = 0; dc < 3; dc++) {
      const schluessel = dr + ':' + dc;
      const eckig = (dr !== 1 && dc !== 1);
      if (aufgabe.form === 'plus' && eckig) continue;
      felder.push(schluessel);
    }
  }
  return felder;
}

function tafelAufgabe(stufe) {
  const r = zufall(1, 8), c = zufall(1, 8);
  const mitte = r * 10 + c + 1;
  const werte = [];
  for (let dr = -1; dr <= 1; dr++) {
    const zeile = [];
    for (let dc = -1; dc <= 1; dc++) zeile.push(mitte + dr * 10 + dc);
    werte.push(zeile);
  }
  const form = stufe === 1 ? 'plus' : 'block';
  let sichtbar;
  if (stufe === 3) {
    // Vorgegeben ist eine Ecke oder Kante, nicht die Mitte
    const moeglich = ['0:0', '0:1', '0:2', '1:0', '1:2', '2:0', '2:1', '2:2'];
    sichtbar = moeglich[zufall(0, moeglich.length - 1)];
  } else {
    sichtbar = '1:1';
  }
  return { werte, form, sichtbar };
}

function feldTafel() {
  const aufgabe = stand.aufgabe;
  const zellen = [];
  for (let dr = 0; dr < 3; dr++) {
    for (let dc = 0; dc < 3; dc++) {
      const schluessel = dr + ':' + dc;
      const eckig = (dr !== 1 && dc !== 1);
      if (aufgabe.form === 'plus' && eckig) {
        zellen.push('<div class="tfeld aus"></div>');
      } else if (schluessel === aufgabe.sichtbar) {
        zellen.push(`<div class="tfeld">${aufgabe.werte[dr][dc]}</div>`);
      } else {
        zellen.push(`<div class="tfeld leer"><input type="number" inputmode="numeric"
          data-feld="${schluessel}" aria-label="Feld Zeile ${dr + 1}, Spalte ${dc + 1}"></div>`);
      }
    }
  }
  return `<p class="aufgabentext">Trage die fehlenden Zahlen ein. Nach rechts wird es
    um eins mehr, nach unten um zehn mehr.</p>
    <div class="tafel">${zellen.join('')}</div>`;
}

    return { falsche, hinweis };
  },

// ============================================================
// uhr
// ============================================================
function uhrAufgabe(stufe) {
  const minuten = { 1: [0, 30], 2: [0, 15, 30, 45], 3: [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55] }[stufe];
  return {
    stunde: zufall(1, 12),
    minute: minuten[zufall(0, minuten.length - 1)]
  };
}

// Jede Zeigerstellung kommt am Tag zweimal vor. Gefragt sind beide Uhrzeiten.
// Bei 12 Uhr gilt vormittags 0 (Mitternacht) oder 12, nachmittags 12.
function uhrStunden(stunde) {
  return stunde === 12 ? { vor: [0, 12], nach: [12], vorText: 0, nachText: 12 }
                       : { vor: [stunde], nach: [stunde + 12], vorText: stunde, nachText: stunde + 12 };
}

function feldUhr() {
  const { stunde, minute } = stand.aufgabe;
  const zeile = (wort, s, m) => `
    <div style="display:flex;align-items:center;gap:8px;font-size:24px;font-weight:bold">
      <span style="font-size:17px;font-weight:normal;min-width:120px;text-align:right">${wort}</span>
      <input type="number" inputmode="numeric" data-feld="${s}" aria-label="Stunde ${wort}">
      <span>:</span>
      <input type="number" inputmode="numeric" data-feld="${m}" aria-label="Minute ${wort}">
      <span style="font-size:17px;font-weight:normal">Uhr</span>
    </div>`;
  return `<p class="aufgabentext">Wie spät ist es? Schreibe die Uhrzeit für den Vormittag
    und für den Nachmittag auf.</p>
    ${uhrBild(stunde, minute, 210)}
    ${zeile('vormittags', 'sv', 'mv')}
    ${zeile('nachmittags', 'sn', 'mn')}`;
}

      <circle cx="30" cy="22" r="1.8" fill="#16263F"/></svg>`,

    const falsche = [];
    const h = uhrStunden(a.stunde);

                   ['sn', h.nach, 'die Stunde am Nachmittag'], ['mn', [a.minute], 'die Minute am Nachmittag']];
    teile.forEach(([name, erlaubt, wort]) => {
      const richtig = erlaubt.includes(Number(ctx.werte[name]));
      ctx.markieren(name, richtig);
      if (!richtig) falsche.push(wort);

    let hinweis = '';

      hinweis = 'Am Nachmittag zählt man weiter: 1 Uhr nachmittags ist 13 Uhr.';
    }
    return { falsche, hinweis };
  },

  loesung(a, ctx) {

    felderEintragen({ sv: h.vorText, mv: a.minute, sn: h.nachText, mn: a.minute }, ctx);

function vergroessernAufgabe(stufe) {
  const plan = { 1: { anzahl: 3, faktor: 2, seite: 3 },
                 2: { anzahl: 4, faktor: 2, seite: 4 },
                 3: { anzahl: 3, faktor: 3, seite: 3 } }[stufe];
  const vorlage = blobBauen(plan.seite, plan.seite, plan.anzahl);
  const loesung = [];
  vorlage.forEach(z => {
    for (let dx = 0; dx < plan.faktor; dx++)
      for (let dy = 0; dy < plan.faktor; dy++)
        loesung.push({ x: z.x * plan.faktor + dx, y: z.y * plan.faktor + dy });
  });
  return { faktor: plan.faktor, seite: plan.seite, vorlage, loesung,
           spalten: plan.seite * plan.faktor, zeilen: plan.seite * plan.faktor };
}

function feldVergroessern() {
  const v = stand.aufgabe;
  return `<p class="aufgabentext">Zeichne die Figur <strong>${v.faktor === 2 ? 'doppelt' : 'dreifach'}
    so groß</strong>. Aus jedem Kästchen werden ${v.faktor * v.faktor}.</p>
    <div style="display:flex;gap:26px;flex-wrap:wrap;justify-content:center;align-items:flex-start">
      <div style="text-align:center">
        ${klickGitter(v.seite, v.seite, v.vorlage, () => false, null)}
        <div style="font-size:15px;margin-top:4px">Vorlage</div>
      </div>
      <div style="text-align:center">
        ${klickGitter(v.spalten, v.zeilen, [], null, null)}
        <div style="font-size:15px;margin-top:4px">deine Zeichnung</div>
      </div>
    </div>`;
}

// ============================================================
// zeitspanne
// ============================================================
function zeitspanneAufgabe(stufe) {
  const startH = zufall(1, 12);
  const startM = zufall(0, 11) * 5;

  if (stufe === 1) {
    const rest = 60 - startM;
    const dauer = zufall(1, Math.max(1, (rest - 5) / 5)) * 5;   // bleibt in derselben Stunde
    const ende = startM + dauer;
    return { art: 'minuten', startH, startM, endeH: startH, endeM: ende, dauer };
  }

  if (stufe === 2) {
    const dauer = zufall(13, 36) * 5;            // 65 bis 180 Minuten
    const gesamt = startH * 60 + startM + dauer;
    return {
      art: 'stundenUndMinuten', startH, startM,
      endeH: Math.floor(gesamt / 60),   // laeuft ueber 12 weiter: 12:25 + 50 min = 13:15
      endeM: gesamt % 60,
      dauer, dauerStunden: Math.floor(dauer / 60), dauerMinuten: dauer % 60
    };
  }

  const dauer = zufall(5, 36) * 5;
  const gesamt = startH * 60 + startM + dauer;
  return {
    art: 'endzeit', startH, startM,
    endeH: Math.floor(gesamt / 60),   // laeuft ueber 12 weiter: 12:25 + 50 min = 13:15
    endeM: gesamt % 60,
    dauer, dauerStunden: Math.floor(dauer / 60), dauerMinuten: dauer % 60
  };
}

function feldZeitspanne() {
  const z = stand.aufgabe;
  const alsText = (h, m) => h + ':' + String(m).padStart(2, '0');

  if (z.art === 'endzeit') {
    return `<p class="aufgabentext">Die Uhr zeigt den Start. Wie spät ist es
      ${z.dauerStunden ? z.dauerStunden + (z.dauerStunden === 1 ? ' Stunde ' : ' Stunden ') : ''}${
      z.dauerMinuten ? z.dauerMinuten + ' Minuten ' : ''}später?</p>
      ${uhrBild(z.startH, z.startM, 190)}
      <p class="aufgabentext">Start: ${alsText(z.startH, z.startM)} Uhr</p>
      <div style="display:flex;align-items:center;gap:8px;font-size:24px;font-weight:bold">
        <input type="number" inputmode="numeric" data-feld="stunde" aria-label="Stunde">
        <span>:</span>
        <input type="number" inputmode="numeric" data-feld="minute" aria-label="Minute">
        <span style="font-size:17px;font-weight:normal">Uhr</span>
      </div>`;
  }

  const felder = z.art === 'minuten'
    ? `<input type="number" inputmode="numeric" data-feld="minuten" aria-label="Dauer in Minuten">
       <span class="wort">Minuten</span>`
    : `<input type="number" inputmode="numeric" data-feld="stunden" style="width:80px" aria-label="Stunden">
       <span class="wort">Stunden</span>
       <input type="number" inputmode="numeric" data-feld="minuten" style="width:80px" aria-label="Minuten">
       <span class="wort">Minuten</span>`;

  return `<p class="aufgabentext">Wie lange dauert es von der ersten bis zur zweiten Uhr?
    ${z.art === 'stundenUndMinuten' ? 'Gib Stunden und Minuten an, die Minuten kleiner als 60.' : ''}</p>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center">
      <div style="text-align:center">${uhrBild(z.startH, z.startM, 160)}
        <div style="font-size:15px">Start ${alsText(z.startH, z.startM)} Uhr</div></div>
      <span style="font-size:26px;color:var(--blau)">&rarr;</span>
      <div style="text-align:center">${uhrBild(z.endeH, z.endeM, 160)}
        <div style="font-size:15px">Ende ${alsText(z.endeH, z.endeM)} Uhr</div></div>
    </div>
    <div class="divzeile">${felder}</div>`;
}

spielAnmelden({
  id: 'zeitspanne',
  name: 'Zeitspannen',
    beschreibung: 'Wie lange dauert es von einer Uhrzeit bis zur anderen? Rechne über die volle Stunde in zwei Schritten.',
    stufen: ['innerhalb einer Stunde', 'über die Stunde hinweg', 'Endzeit gesucht'],
    klassen: [3, 3, 4],
    bild: `<svg viewBox="0 0 60 44" width="60" height="44" aria-hidden="true">
      <circle cx="16" cy="22" r="12" fill="#fff" stroke="#1D4ED8" stroke-width="2"/>
      <line x1="16" y1="22" x2="16" y2="14" stroke="#16263F" stroke-width="2"/>
      <line x1="16" y1="22" x2="22" y2="25" stroke="#EA580C" stroke-width="1.8"/>
      <circle cx="46" cy="22" r="12" fill="#fff" stroke="#1D4ED8" stroke-width="2"/>
      <line x1="46" y1="22" x2="50" y2="15" stroke="#16263F" stroke-width="2"/>
      <line x1="46" y1="22" x2="46" y2="31" stroke="#EA580C" stroke-width="1.8"/>
      <path d="M30 10 q1 -4 3 0" fill="none" stroke="#1D4ED8" stroke-width="1.6"/>
    </svg>`,

  aufgabe: zeitspanneAufgabe,

  feld() { return feldZeitspanne(); },

  pruefe(a, ctx) {
    const falsche = [];
    let hinweis = '';
    const z = a;
    if (z.art === 'minuten') {
      const richtig = Number(ctx.werte.minuten) === z.dauer;
      ctx.markieren('minuten', richtig);
      if (!richtig) falsche.push('die Dauer');
    } else if (z.art === 'stundenUndMinuten') {
      const st = Number(ctx.werte.stunden), mi = Number(ctx.werte.minuten);
      // Jedes Feld fuer sich markieren, damit man sieht, was nicht stimmt
      const stundenRichtig = st === z.dauerStunden;
      const minutenRichtig = mi === z.dauerMinuten;
      ctx.markieren('stunden', stundenRichtig);
      ctx.markieren('minuten', minutenRichtig);
      if (!stundenRichtig) falsche.push('die Stunden');
      if (!minutenRichtig) falsche.push('die Minuten');
      // Sonderfall: insgesamt richtig, aber mit 60 Minuten oder mehr geschrieben
      if (falsche.length && st * 60 + mi === z.dauer) {
        hinweis = 'Die Dauer stimmt, aber die Minuten müssen kleiner als 60 sein. 60 Minuten sind eine Stunde.';
      }
    } else {
      const st = Number(ctx.werte.stunde), mi = Number(ctx.werte.minute);
      // Die Uhr zeigt nicht, ob Vor- oder Nachmittag ist. 13:15 und 1:15 sind
      // dieselbe Zeigerstellung, deshalb zaehlt beides.
      const stundeRichtig = Number.isInteger(st) && st >= 0 && st < 24 && st % 12 === z.endeH % 12;
      const minuteRichtig = mi === z.endeM;
      ctx.markieren('stunde', stundeRichtig);
      ctx.markieren('minute', minuteRichtig);
      if (!stundeRichtig) falsche.push('die Stunde');
      if (!minuteRichtig) falsche.push('die Minute');
    }
    return { falsche, hinweis };
  },

  loesung(a, ctx) {
    const werte = {};
    if (a.art === 'minuten') werte.minuten = a.dauer;
    else if (a.art === 'stundenUndMinuten') { werte.stunden = a.dauerStunden; werte.minuten = a.dauerMinuten; }
    else { werte.stunde = a.endeH; werte.minute = a.endeM; }
    felderEintragen(werte, ctx);
  }
});


/* ----- spiele/zerlegung.js ----- */
// ============================================================
// zerlegung
// ============================================================
function zerlegungAufgabe(stufe) {
  const plan = {
    1: { von: 5,  bis: 10,  zeilen: 4, dachOffen: false },
    2: { von: 11, bis: 20,  zeilen: 5, dachOffen: false },
    3: { von: 30, bis: 100, zeilen: 5, dachOffen: true }
  }[stufe];

  const ganzes = zufall(plan.von, plan.bis);

  // Nur Paare bis zur Haelfte ziehen und danach zufaellig drehen. Sonst stuenden
  // 12 + 5 und 5 + 12 als zwei Etagen im selben Haus, das ist dieselbe Zerlegung.
  const moeglich = [];
  for (let a = 1; a <= Math.floor(ganzes / 2); a++) moeglich.push(a);
  for (let i = moeglich.length - 1; i > 0; i--) {
    const j = zufall(0, i);
    [moeglich[i], moeglich[j]] = [moeglich[j], moeglich[i]];
  }
  const anzahl = Math.min(plan.zeilen, moeglich.length);
  const linke = moeglich.slice(0, anzahl);

  // Bei offenem Dach ist eine Etage vollstaendig, daraus ergibt sich das Ganze
  const vollstaendig = plan.dachOffen ? zufall(0, anzahl - 1) : -1;

  const zeilen = linke.map((klein, i) => {
    const gedreht = zufall(0, 1) === 0;
    const a = gedreht ? ganzes - klein : klein;
    return {
      a, b: ganzes - a,
      luecke: i === vollstaendig ? 'keine' : (zufall(0, 1) === 0 ? 'links' : 'rechts')
    };
  });

  return { ganzes, zeilen, dachOffen: plan.dachOffen };
}

function feldZerlegung() {
  const z = stand.aufgabe;
  const dach = z.dachOffen
    ? `<input type="number" inputmode="numeric" data-feld="dach" aria-label="Zahl im Dach">`
    : z.ganzes;

  const zeilen = z.zeilen.map((zeile, i) => {
    const feld = (seite) => `<div class="hzelle eingabe"><input type="number" inputmode="numeric"
      data-feld="z${i}" aria-label="Etage ${i + 1}, ${seite}"></div>`;
    const fest = (wert) => `<div class="hzelle fest">${wert}</div>`;
    if (zeile.luecke === 'links') return `<div class="hzeile">${feld('linke Zahl')}${fest(zeile.b)}</div>`;
    if (zeile.luecke === 'rechts') return `<div class="hzeile">${fest(zeile.a)}${feld('rechte Zahl')}</div>`;
    return `<div class="hzeile">${fest(zeile.a)}${fest(zeile.b)}</div>`;
  }).join('');

  return `<p class="aufgabentext">${z.dachOffen
      ? 'Eine Etage ist vollständig. Finde damit die Zahl im Dach und fülle die übrigen Etagen.'
      : 'Beide Zahlen einer Etage ergeben zusammen die Zahl im Dach.'}</p>
    <div class="haus">
      <div class="hdach"></div>
      <div class="hganzes">${dach}</div>
      ${zeilen}
    </div>`;
}

spielAnmelden({
  id: 'zerlegung',
  name: 'Zerlegungshaus',
    beschreibung: 'Im Dach steht das Ganze. In jeder Etage ergeben die beiden Zahlen zusammen genau diese Zahl.',
    stufen: ['bis 10', 'bis 20', 'bis 100, Dach gesucht'],
    klassen: [1, 1, 3],
    bild: `<svg viewBox="0 0 60 44" width="60" height="44" aria-hidden="true">
      <polygon points="30,3 54,18 6,18" fill="#1D4ED8"/>
      <rect x="10" y="18" width="40" height="9" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.6"/>
      <rect x="10" y="28" width="19" height="9" fill="#fff" stroke="#1D4ED8" stroke-width="1.6"/>
      <rect x="31" y="28" width="19" height="9" fill="#fff" stroke="#1D4ED8" stroke-width="1.6"/>
    </svg>`,

  aufgabe: zerlegungAufgabe,

  feld() { return feldZerlegung(); },

  pruefe(a, ctx) {
    const falsche = [];
    let hinweis = '';
    const z = a;
    let etagenFalsch = 0, dachFalsch = false;
    if (z.dachOffen) {
      dachFalsch = Number(ctx.werte.dach) !== z.ganzes;
      ctx.markieren('dach', !dachFalsch);
    }
    z.zeilen.forEach((zeile, i) => {
      if (zeile.luecke === 'keine') return;
      const soll = zeile.luecke === 'links' ? zeile.a : zeile.b;
      const richtig = Number(ctx.werte['z' + i]) === soll;
      ctx.markieren('z' + i, richtig);
      if (!richtig) etagenFalsch++;
    });
    if (dachFalsch) falsche.push('die Zahl im Dach');
    if (etagenFalsch) falsche.push(etagenFalsch === 1 ? 'eine Etage' : etagenFalsch + ' Etagen');
    return { falsche, hinweis };
  },

  loesung(a, ctx) {
    const werte = {};
    if (a.dachOffen) werte.dach = a.ganzes;
    a.zeilen.forEach((zeile, i) => {
      if (zeile.luecke === 'links') werte['z' + i] = zeile.a;
      else if (zeile.luecke === 'rechts') werte['z' + i] = zeile.b;
    });
    felderEintragen(werte, ctx);
  }
});
